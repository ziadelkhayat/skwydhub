// countries: name, dialing code, usual currency (Lebanon and Syria price in US dollars by default)
const COUNTRIES = (() => { const L = SKW_WORLD.c.map(([iso, n, d, cur]) => [n, d, iso==="LB"||iso==="SY" ? "USD" : cur]).sort((x, y) => x[0].localeCompare(y[0])); const lb = L.findIndex(x => x[0]==="Lebanon"); if (lb > 0) L.unshift(...L.splice(lb, 1)); return L; })();
const CURRENCIES = (() => { let codes = [...new Set(SKW_WORLD.c.map(c => c[3]).filter(Boolean))]; try { codes = [...new Set([...codes, ...Intl.supportedValuesOf("currency")])]; } catch (e) {}
  let dn = null; try { dn = new Intl.DisplayNames(["en"], { type: "currency" }); } catch (e) {}
  return codes.map(k => [k, `${(dn && dn.of(k)) || k} (${k})`]).sort((x, y) => x[1].localeCompare(y[1])); })();
const countryOpts = sel => `<option value="">Choose…</option>` + COUNTRIES.map(([n]) => `<option ${n===sel?"selected":""}>${n}</option>`).join("");
const dialOpts = sel => COUNTRIES.map(([n, d]) => `<option value="${n}" ${n===sel?"selected":""}>${n} (${d})</option>`).join("");
const dialOf = n => (COUNTRIES.find(c => c[0]===n) || [,""])[1];
const CATEGORIES = [["F&B",["Food QSR","Casual Dining","Fine Dining","Cafe","Bakery & Pastry","Cloud Kitchen","Bar & Lounge","Catering","Food Truck"]],["Retail",["Grocery","Butcher","Supermarket","Other retail"]],["Services",["Salon & Spa","Laundry","Other services"]]];   // same list as the back office (Account → Business)
const categoryOpts = sel => `<option value="">Choose…</option>` + CATEGORIES.map(([c]) => `<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("");
const subOpts = (cat, sel) => `<option value="">Choose…</option>` + ((CATEGORIES.find(x => x[0]===cat) || [,[]])[1]).map(s => `<option ${s===sel?"selected":""}>${esc(s)}</option>`).join("");

const currencyOpts = sel => `<option value="">Choose…</option>` + CURRENCIES.map(([k,t]) => `<option value="${k}" ${k===sel?"selected":""}>${t}</option>`).join("");
// picking a country fills in its dialing code and currency
function geoLink(form) { const f = form.elements; f.country.onchange = () => { const c = COUNTRIES.find(x => x[0] === f.country.value); if (!c) return; f.dial.value = c[0]; f.currency.value = c[2]; };
  f.category.onchange = () => { f.subcategory.innerHTML = subOpts(f.category.value, ""); f.subcategory.disabled = !f.category.value; }; }
const fullPhone = (country, num) => { const dial = dialOf(country); num = String(num || "").replace(/\D/g, "").replace(/^0+/, ""); return num ? dial + num : ""; };   // +96170123456, as the back office saves it
const HEAD = (t, s) => `<div class="logo">${LOGO}</div><h1>${t}</h1><p class="lead">${s}</p>`;

function form(msg = "") { if (msg) setTimeout(() => toast(msg), 300);
  $("#card").innerHTML = HEAD("Start Your Free Trial", "Run your restaurant on Skwyd Hub: POS, back office, inventory and online ordering.") +
  `<div class="perks"><span>✓ No card needed</span><span>✓ Every module included in the trial</span></div>
  <form id="f" autocomplete="on" novalidate><div class="grid">
    <div><label for="fn">First Name <i class="req">*</i></label><input class="sel" id="fn" required autocomplete="given-name"></div>
    <div><label for="ln">Last Name <i class="req">*</i></label><input class="sel" id="ln" required autocomplete="family-name"></div>
    <div class="full"><label for="ph">Phone Number <i class="req">*</i></label><div style="display:flex;gap:8px"><select class="sel" id="dl" name="dial" style="width:190px;flex:none" aria-label="Country code">${dialOpts("Lebanon")}</select><input class="sel" id="ph" name="phone" required autocomplete="tel-national" inputmode="tel" style="flex:1;min-width:0"></div></div>
    <div class="full"><label for="em">Email <i class="req">*</i></label><input class="sel" id="em" type="email" required autocomplete="email"></div>
    <div class="full"><label for="pw">Password <i class="req">*</i></label><input class="sel" id="pw" type="password" required minlength="6" autocomplete="new-password"></div>
    <div class="full"><label for="co">Business Name <i class="req">*</i></label><input class="sel" id="co" required autocomplete="organization"></div>
    <div><label for="cg">Business Category <i class="req">*</i></label><select class="sel" id="cg" name="category" required>${categoryOpts("")}</select></div>
    <div><label for="sc">Business Subcategory <i class="req">*</i></label><select class="sel" id="sc" name="subcategory" required disabled>${subOpts("", "")}</select></div>
    <div><label for="ct">Business Location <i class="req">*</i></label><select class="sel" id="ct" name="country" required>${countryOpts("Lebanon")}</select></div>
    <div><label for="cu">Currency <i class="req">*</i></label><select class="sel" id="cu" name="currency" required>${currencyOpts("USD")}</select></div>
    <div class="full"><label class="terms"><input type="checkbox" id="tc" required> Accept Terms and Conditions</label></div>
  </div><button class="pri" id="go">Start Your Free Trial</button><div class="err" id="err">${esc(msg)}</div></form>
  <div class="foot">Already using Skwyd Hub? <a href="/">Sign In</a></div>`;
  $("#fn").focus(); geoLink($("#f"));
  $("#f").onsubmit = async e => {
    e.preventDefault(); const b = $("#go"), err = { set textContent(m) { if (m) toast(m); } };
    const bad = [...e.target.querySelectorAll("input[required],select[required]")].find(x => x.type === "checkbox" ? false : !x.disabled && !String(x.value).trim());
    if (bad) { const lb = (document.querySelector(`label[for="${bad.id}"]`)?.textContent || "This field").replace("*", "").trim(); toast(lb + " is required."); bad.focus(); return; }
    if (!$("#em").value.trim() || !$("#em").checkValidity()) { toast("Enter a valid email."); $("#em").focus(); return; }
    if (!$("#tc").checked) { err.textContent = "Accept the terms and conditions to continue."; return; }
    if ($("#pw").value.length < 6) { err.textContent = "The password needs at least 6 characters."; return; }
    b.disabled = true; b.textContent = "Creating…";
    const email = $("#em").value.trim();
    const { data, error } = await sb.auth.signUp({ email, password: $("#pw").value, options: {
      emailRedirectTo: location.origin + "/signup",
      data: { signup: "company", company: $("#co").value.trim(), name: ($("#fn").value.trim() + " " + $("#ln").value.trim()).trim(), first_name: $("#fn").value.trim(), last_name: $("#ln").value.trim(), phone: fullPhone($("#dl").value, $("#ph").value), category: $("#cg").value, subcategory: $("#sc").value, country: $("#ct").value, currency: $("#cu").value } } });
    b.disabled = false; b.textContent = "Start Your Free Trial";
    if (error) { err.textContent = /registered|exists/i.test(error.message) ? "This email already has a Skwyd Hub account. Sign in instead." : error.message; return; }
    if (data.user && !(data.user.identities || []).length) { err.textContent = "This email already has a Skwyd Hub account. Sign in instead."; return; }
    if (data.session) return welcome();
    $("#card").innerHTML = HEAD("Check Your Email", "One last step") +
      `<p class="ok">We sent a link to <b>${esc(email)}</b>. Open it to confirm your email, and you'll get your account number right here.</p>
       <div class="foot">Didn't get it? Check spam, or <a href="#" id="again">send it again</a>.</div><div class="err" id="err"></div>`;
    $("#again").onclick = async e2 => { e2.preventDefault(); const r = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: location.origin + "/signup" } });
      if (r.error) toast(r.error.message); else toastOk("Sent again."); };
  };
}

// signed in (right after sign-up, or back from the confirmation email): show the account number
async function welcome() {
  let d = null;
  for (let i = 0; i < 5 && !d?.company; i++) { const r = await sb.rpc("slick_my_subscription"); d = r.data; if (!d?.company) await new Promise(r => setTimeout(r, 800)); }
  if (!d?.company) { await sb.auth.signOut({ scope: "local" }); return form("This login isn't linked to a business. Sign in instead, or contact Skwyd Hub."); }
  try { localStorage.setItem("skwyd_acct", d.company.accountNo || ""); } catch (e) {}
  $("#card").innerHTML = HEAD(`Welcome, ${esc(d.company.name)}`, `Your free trial is on${d.daysLeft ? ` for ${d.daysLeft} days` : ""}.`) +
    `<div class="acct"><span>Your Account Number</span><b>${esc(d.company.accountNo || "—")}</b></div>
     <p class="ok">Keep it: you and your staff sign in with it, together with your email and password.</p>
     <button class="pri" onclick="location.href='/dashboard'">Open My Back Office</button>`;
}

// ---------- same behaviour as the back office ----------
// messages: red for errors, green when something is saved
let TT = 0;
function toastShow(m, ok) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = m; t.classList.toggle("ok", !!ok); void t.offsetWidth; t.classList.add("show"); clearTimeout(TT); TT = setTimeout(() => t.classList.remove("show"), ok ? 2200 : 3600); }
const toast = m => toastShow(String(m || ""), false), toastOk = m => toastShow(String(m || ""), true);
// a question box in place of the browser's confirm: Enter answers yes, Esc answers no
// dropdowns with a search box (the real <select> stays underneath, so every form reads it as before)
const MS_CARET = `<svg class="msel-k" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
function msPaint(m) { const f = m.querySelector(":scope > .msel-f"), sel = m.querySelector("select"); if (!f || !sel) return;
  const o = sel.options[sel.selectedIndex], t = o && o.value !== "" ? o.text : "";
  f.innerHTML = (t ? `<span class="msel-v">${esc(t)}</span>` : `<span class="msel-ph">Choose...</span>`) + MS_CARET; f.classList.toggle("dis", sel.disabled); m.dataset.v = sel.value; m.dataset.n = sel.options.length; }
function msEnhance(root = document) {
  root.querySelectorAll("select.sel:not([multiple]):not([data-ms])").forEach(sel => { sel.dataset.ms = "1";
    const m = document.createElement("div"); m.className = "msel mselect"; if (sel.style.width) m.style.width = sel.style.width; sel.parentNode.insertBefore(m, sel); m.appendChild(sel);
    const f = document.createElement("div"); f.className = "msel-f"; f.tabIndex = 0; f.setAttribute("role", "button"); f.setAttribute("aria-label", sel.name || "Choose");
    const p = document.createElement("div"); p.className = "msel-p"; p.hidden = true; p.innerHTML = `<input class="msel-q" placeholder="Type something to start searching" autocomplete="off"><div class="msel-l"></div>`;
    m.prepend(p); m.prepend(f); msPaint(m); });
}
function msPlace(m) { const p = m.querySelector(":scope > .msel-p"), r = m.querySelector(":scope > .msel-f").getBoundingClientRect(), up = innerHeight - r.bottom < 300 && r.top > innerHeight - r.bottom;
  Object.assign(p.style, { left: r.left + "px", width: "max-content", minWidth: r.width + "px", maxWidth: Math.max(r.width, Math.min(460, innerWidth - 16)) + "px", top: up ? "auto" : (r.bottom + 4) + "px", bottom: up ? (innerHeight - r.top + 4) + "px" : "auto" });
  const pw = p.getBoundingClientRect().width; if (pw && r.left + pw > innerWidth - 8) p.style.left = Math.max(8, innerWidth - 8 - pw) + "px"; }
function msClose(except) { document.querySelectorAll(".msel.open").forEach(m => { if (m !== except) { m.classList.remove("open"); m.querySelector(":scope > .msel-p").hidden = true; } }); }
function msOpen(m) { msClose(m); const sel = m.querySelector("select"); if (sel.disabled) return; const p = m.querySelector(":scope > .msel-p");
  const opts = [...sel.options].filter(o => !(o.value === "" && /^(choose|select)/i.test(o.text)) && !o.hidden);
  p.querySelector(".msel-l").innerHTML = (!sel.required && [...sel.options].some(o => o.value === "") ? `<button type="button" class="msel-o${sel.value === "" ? " on" : ""}" data-msv="">None</button>` : "")
    + opts.map(o => `<button type="button" class="msel-o${o.value === sel.value ? " on" : ""}" data-msv="${esc(o.value)}"${o.disabled ? " disabled" : ""}>${esc(o.text)}</button>`).join("") || `<div class="msel-none">No options</div>`;
  m.classList.add("open"); p.hidden = false; const q = p.querySelector(".msel-q"); q.value = ""; msPlace(m); p.querySelector(".msel-o.on")?.scrollIntoView({ block: "nearest" }); setTimeout(() => q.focus(), 0); }
document.addEventListener("click", e => {
  const f = e.target.closest(".msel-f"); if (f) { e.preventDefault(); const m = f.parentElement; m.classList.contains("open") ? msClose() : msOpen(m); return; }
  const o = e.target.closest(".mselect .msel-o"); if (o) { e.preventDefault(); const m = o.closest(".msel"), sel = m.querySelector("select"); sel.value = o.dataset.msv;
    sel.dispatchEvent(new Event("input", { bubbles: true })); sel.dispatchEvent(new Event("change", { bubbles: true })); msClose(); if (document.contains(m)) msPaint(m); m.querySelector(".msel-f")?.focus(); return; }
  if (e.target.closest(".msel-p")) return;
  msClose();
}, true);
document.addEventListener("input", e => { if (!e.target.classList?.contains("msel-q")) return; const q = e.target.value.trim().toLowerCase(), l = e.target.parentElement.querySelector(".msel-l");
  l.querySelectorAll(".msel-o").forEach(o => { o.hidden = !!q && !o.textContent.toLowerCase().includes(q); });
  l.querySelector(".msel-emp")?.remove(); if (![...l.querySelectorAll(".msel-o")].some(o => !o.hidden)) l.insertAdjacentHTML("beforeend", `<div class="msel-none msel-emp">No results</div>`); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".msel.open")) { e.preventDefault(); e.stopPropagation(); msClose(); return; }
  const f = e.target.closest?.(".msel-f"); if (f && (e.key === "Enter" || e.key === " " || e.key === "ArrowDown")) { e.preventDefault(); msOpen(f.parentElement); return; }
  if (e.target.classList?.contains("msel-q") && e.key === "Enter") { e.preventDefault(); [...e.target.parentElement.querySelectorAll(".msel-o")].find(o => !o.hidden)?.click(); }
}, true);
addEventListener("scroll", e => { if (e.target.closest?.(".msel-p")) return; document.querySelectorAll(".msel.open").forEach(msPlace); }, true);
addEventListener("resize", () => document.querySelectorAll(".msel.open").forEach(msPlace));
// a value or option list changed by code (picking a country fills its currency) shows straight away
setInterval(() => document.querySelectorAll(".mselect").forEach(m => { const sel = m.querySelector("select"); if (sel && (m.dataset.v !== sel.value || +m.dataset.n !== sel.options.length || m.querySelector(".msel-f").classList.contains("dis") !== sel.disabled)) msPaint(m); }), 300);
new MutationObserver(() => msEnhance()).observe(document.body, { childList: true, subtree: true });
// Enter saves the open form (also from a dropdown or checkbox); Esc closes the dialog
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey || e.isComposing || document.querySelector(".slk-ask, .msel.open, .cal")) return;
  const t = e.target; if (t.matches?.("textarea, button, a, .msel-q")) return;
  const form = t.closest?.("form") || ($("#m")?.classList.contains("on") ? $("#sf") : null); if (!form || t.matches?.("input:not([type=checkbox]):not([type=radio])")) return;
  e.preventDefault(); form.requestSubmit();
});

(async () => {   // back from the confirmation email (or still signed in during the trial): straight to the account number
  const { data: { session } } = await sb.auth.getSession();
  if (session) { const r = await sb.rpc("slick_my_subscription"); if (r.data?.company && r.data.status === "trial") return welcome(); }
  form();
})();
</script>
