name: SKWYD POS (React Native) APK
on:
  push:
    branches: [main]
    paths: ["apps/pos/**", ".github/workflows/pos-rn.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pos-rn
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm ci
      - name: Generate the Android project (Expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build the APK (release, signed with the debug key so it installs directly)
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Keep the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../../skwyd-pos-rn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: skwyd-pos-rn
          path: skwyd-pos-rn.apk
      - name: Publish as the "pos-rn" pre-release (replaced on every build)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pos-rn --yes --cleanup-tag || true
          gh release create pos-rn skwyd-pos-rn.apk --prerelease --title "SKWYD POS (React Native) preview" --notes "Built from ${GITHUB_SHA::7}. Installs next to the current POS (package com.skwydhub.posrn)."
