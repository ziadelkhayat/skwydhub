name: SKWYD Team & Driver (React Native) APKs
on:
  push:
    branches: [main]
    paths: ["apps/team/**", ".github/workflows/team-rn.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: team-rn
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [team, driver, insights]   # one code base: EXPO_PUBLIC_SKWYD_APP=driver adds the delivery orders; insights is the owner's app
    env:
      EXPO_PUBLIC_SKWYD_APP: ${{ matrix.app }}
    defaults:
      run:
        working-directory: apps/team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm ci
      - name: Generate the Android project (Expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build the APK (release, signed with the debug key so it installs directly)
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Keep the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../../skwyd-${{ matrix.app }}-rn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: skwyd-${{ matrix.app }}-rn
          path: skwyd-${{ matrix.app }}-rn.apk
      - name: Publish as the "<app>-rn" pre-release (replaced on every build)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ matrix.app }}-rn --yes --cleanup-tag || true
          gh release create ${{ matrix.app }}-rn skwyd-${{ matrix.app }}-rn.apk --prerelease --title "SKWYD ${{ matrix.app == 'driver' && 'Driver' || matrix.app == 'insights' && 'Insights' || 'Team' }} (React Native) preview" --notes "Built from ${GITHUB_SHA::7}. Installs next to the current app."
