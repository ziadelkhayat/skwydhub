name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android POS app (APK)
        run: |
          rm -rf node_modules   # the committed node_modules is incomplete (.gitignore drops @capacitor/cli/dist/web), so install fresh
          npm install
          mkdir -p www && cp pos.html www/index.html && cp wokdb.js modpick.js ioskit.js ioskit.css theme-dark-pos.css posv3.js pos.webmanifest www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js || curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js -o www/supabase.js
          npx cap add android
          # app icon: each app has its own (android-icons/<app>/<density>__<file>.png -> res/mipmap-<density>/<file>.png); Insights uses the main "hub" logo
          for f in android-icons/pos/*.png; do b=$(basename "$f"); d=${b%%__*}; n=${b#*__}; mkdir -p "android/app/src/main/res/mipmap-$d"; cp "$f" "android/app/src/main/res/mipmap-$d/$n"; done
          for f in android-splash/pos/*.png; do d=$(basename "$f" .png); mkdir -p "android/app/src/main/res/$d"; cp "$f" "android/app/src/main/res/$d/splash.png"; done   # loading screen: the skwyd logo on navy
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="fullSensor"/' android/app/src/main/AndroidManifest.xml   # POS turns with the tablet: landscape and portrait
          # direct printing: a small native plugin sends raw ESC/POS bytes to network printers (Devices → Printers, port 9100)
          mkdir -p android/app/src/main/java/com/skwydhub/pos
          cat > android/app/src/main/java/com/skwydhub/pos/RawPrinterPlugin.java <<'JAVA'
          package com.skwydhub.pos;
          import android.util.Base64;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          @CapacitorPlugin(name = "RawPrinter")
          public class RawPrinterPlugin extends Plugin {
            @PluginMethod
            public void print(PluginCall call) {
              final String host = call.getString("host");
              final String data = call.getString("data");
              final int port = call.getInt("port", 9100);
              final int timeout = call.getInt("timeout", 5000);
              if (host == null || host.isEmpty() || data == null) { call.reject("Missing printer address"); return; }
              new Thread(() -> {
                try (Socket s = new Socket()) {
                  s.connect(new InetSocketAddress(host, port), timeout);
                  s.setSoTimeout(timeout);
                  OutputStream o = s.getOutputStream();
                  o.write(Base64.decode(data, Base64.DEFAULT));
                  o.flush();
                  call.resolve();
                } catch (Exception e) { call.reject("Printer unreachable: " + e.getMessage()); }
              }).start();
            }
          }
          JAVA
          cat > android/app/src/main/java/com/skwydhub/pos/MainActivity.java <<'JAVA'
          package com.skwydhub.pos;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(RawPrinterPlugin.class);
              super.onCreate(savedInstanceState);
              hideBars();
            }
            // full screen register: the Android navigation and status bars stay hidden (swipe from the edge to show them for a moment)
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          JAVA
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item><item name="windowSplashScreenBackground">\#1E3A8A</item>#' android/app/src/main/res/values/styles.xml   # Android 12+ start screen: navy behind the app icon
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build Android Team app (APK)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk skwydhub-pos.apk   # keep the POS app before building the next one
          rm -rf android www
          mkdir -p www && cp team.html www/index.html && cp team-icon-192.png strips.js ioskit.js ioskit.css theme-dark-team.css teamv3.js ioskit-touch.js team.webmanifest www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js || curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js -o www/supabase.js
          printf '{ "appId": "com.skwydhub.team", "appName": "SKWYD Team", "webDir": "www", "server": { "androidScheme": "https" } }\n' > capacitor.config.json
          npx cap add android
          for f in android-icons/team/*.png; do b=$(basename "$f"); d=${b%%__*}; n=${b#*__}; mkdir -p "android/app/src/main/res/mipmap-$d"; cp "$f" "android/app/src/main/res/mipmap-$d/$n"; done
          for f in android-splash/team/*.png; do d=$(basename "$f" .png); mkdir -p "android/app/src/main/res/$d"; cp "$f" "android/app/src/main/res/$d/splash.png"; done   # loading screen: the skwyd logo on navy
          # clock in checks the phone's location at the branch
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item><item name="windowSplashScreenBackground">\#1E3A8A</item>#' android/app/src/main/res/values/styles.xml   # Android 12+ start screen: navy behind the app icon
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../skwyd-team.apk
      - name: Build Android Driver app (APK)
        run: |
          rm -rf android www
          mkdir -p www && sed 's#<head>#<head><script>window.SKWYD_APP="driver"</script>#' team.html > www/index.html && cp team-icon-192.png strips.js ioskit.js ioskit.css theme-dark-team.css teamv3.js ioskit-touch.js team.webmanifest www/
          grep -q 'SKWYD_APP="driver"' www/index.html
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js || curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js -o www/supabase.js
          printf '{ "appId": "com.skwydhub.driver", "appName": "SKWYD Driver", "webDir": "www", "server": { "androidScheme": "https" } }\n' > capacitor.config.json
          npx cap add android
          for f in android-icons/driver/*.png; do b=$(basename "$f"); d=${b%%__*}; n=${b#*__}; mkdir -p "android/app/src/main/res/mipmap-$d"; cp "$f" "android/app/src/main/res/mipmap-$d/$n"; done
          for f in android-splash/driver/*.png; do d=$(basename "$f" .png); mkdir -p "android/app/src/main/res/$d"; cp "$f" "android/app/src/main/res/$d/splash.png"; done   # loading screen: the skwyd logo on navy
          # location for clock in and live tracking, camera for the pickup photo
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -q android.permission.CAMERA android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item><item name="windowSplashScreenBackground">\#1E3A8A</item>#' android/app/src/main/res/values/styles.xml   # Android 12+ start screen: navy behind the app icon
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../skwyd-driver.apk
      - name: Build Android Insights app (APK)
        run: |
          rm -rf android www
          mkdir -p www && cp insights.html www/index.html && cp wokdb.js www/wokdb.js && cp pos-icon-192.png www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js || curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js -o www/supabase.js
          printf '{ "appId": "com.skwydhub.insights", "appName": "SKWYD Insights", "webDir": "www", "server": { "androidScheme": "https" } }\n' > capacitor.config.json
          npx cap add android
          for f in android-icons/hub/*.png; do b=$(basename "$f"); d=${b%%__*}; n=${b#*__}; mkdir -p "android/app/src/main/res/mipmap-$d"; cp "$f" "android/app/src/main/res/mipmap-$d/$n"; done
          for f in android-splash/hub/*.png; do d=$(basename "$f" .png); mkdir -p "android/app/src/main/res/$d"; cp "$f" "android/app/src/main/res/$d/splash.png"; done   # loading screen: the skwyd logo on navy
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item><item name="windowSplashScreenBackground">\#1E3A8A</item>#' android/app/src/main/res/values/styles.xml   # Android 12+ start screen: navy behind the app icon
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../skwyd-insights.apk
      - name: Build the new back office (React preview)
        run: |
          cd app && npm install --no-audit --no-fund && SKWYD_BASE=/skwydhub/v2/ npm run build
      - name: Prepare website
        run: |
          mkdir -p site   # GitHub Pages only hosts the POS app file: the POS is not on the web
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=https://portal.skwydhub.com/">' > site/index.html
          cp skwydhub-pos.apk site/skwydhub-pos.apk
          cp skwyd-team.apk site/skwyd-team.apk
          cp skwyd-driver.apk site/skwyd-driver.apk
          cp skwyd-insights.apk site/skwyd-insights.apk
          cp -r app/dist site/v2   # the new back office, while it is being rebuilt: ziadelkhayat.github.io/skwydhub/v2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
