/* ===================== skwyd hub POS look v2: light, soft violet neutrals, floating cards, colored categories ===================== */
:root{--bg:#f2f4f8;--s:#fff;--sunk:#f7f8fa;--ink:#1b1830;--ink2:#5d5973;--mut:#6f6b85;--faint:#a6a2b8;--line:#e6e9f1;--acc:#0A60D0;--accs:#eef2fc;--acci:#0A60D0;

.ctx{background:var(--accs)!important;border-radius:14px!important;padding:10px 10px 10px 12px!important;gap:10px!important}
.ctx .ci,.ctx .ci-svg{width:40px!important;height:40px!important;border-radius:12px!important;background:var(--s)!important;color:var(--acc)!important;display:grid!important;place-items:center;box-shadow:var(--sh);font-size:0!important;flex:none}

<script>
// every date is written 15-11-2026 (with time: 15-11-2026 19:08)
if(!Date.prototype.dmy) Date.prototype.dmy = function(time){ const p = n => String(n).padStart(2,"0"); return isNaN(this) ? "—" : p(this.getDate()) + "-" + p(this.getMonth()+1) + "-" + this.getFullYear() + (time ? " " + p(this.getHours()) + ":" + p(this.getMinutes()) : ""); };

/* ---------- naming: menu "products" are called Items; inventory "items" are called Products ----------
   Done on what's shown, so data and links keep their names. On inventory screens both words swap
   (there "item" meant an inventory item and "product" a menu product); everywhere else Product → Item. */
const NM_SEEN = new WeakMap();
function nmCase(src, w){ if(src === src.toUpperCase()) return w.toUpperCase(); if(src[0] === src[0].toUpperCase()) return w[0].toUpperCase() + w.slice(1); return w; }
function nmText(t, inv){
  return t.replace(/\b(products?|items?)\b/gi, m => { const l = m.toLowerCase(), pl = l.endsWith("s");
    if(l.startsWith("product")) return nmCase(m, pl ? "items" : "item");
    return inv ? nmCase(m, pl ? "products" : "product") : m; });
}
function nmApply(root){
  const inv = false;
  const skip = el => !el || el.closest?.("#nav, script, style, textarea, [contenteditable], .nm-keep");
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const fix = n => { if(skip(n.parentElement)) return; const was = NM_SEEN.get(n); if(was === n.data) return; const v = nmText(n.data, inv); if(v !== n.data) n.data = v; NM_SEEN.set(n, n.data); };
  if(root.nodeType === 3) fix(root); else { let n; while((n = w.nextNode())) fix(n);
    (root.querySelectorAll ? [root, ...root.querySelectorAll("[placeholder],[title],[aria-label]")] : []).forEach(el => { if(el.nodeType!==1 || skip(el)) return;
      ["placeholder","title","aria-label"].forEach(a => { const v = el.getAttribute?.(a); if(!v) return; const k = { placeholder:"nmPh", title:"nmTi", "aria-label":"nmAl" }[a]; if(el.dataset[k] === v) return; const nv = nmText(v, inv); if(nv !== v) el.setAttribute(a, nv); el.dataset[k] = nv; }); }); }
}
let NMQ = new Set(), NMT = 0;
new MutationObserver(ms => { ms.forEach(m => { if(m.type === "characterData") NMQ.add(m.target); else m.addedNodes.forEach(n => NMQ.add(n)); });
  if(!NMT) NMT = requestAnimationFrame(() => { NMT = 0; const q = [...NMQ]; NMQ = new Set(); q.forEach(n => { if(n.isConnected) nmApply(n); }); }); })
  .observe(document.documentElement, { childList:true, subtree:true, characterData:true });
window.addEventListener("hashchange", () => setTimeout(() => nmApply(document.body), 0));
document.addEventListener("DOMContentLoaded", () => nmApply(document.body));

/* ---------- skwyd hub's own Yes / No message (instead of the browser's) ---------- */
function askDlg(o){
  return new Promise(res => {
    const w = document.createElement("div"); w.className = "slk-ask"; w.setAttribute("role", "dialog"); w.setAttribute("aria-modal", "true");
    const danger = o.input === undefined && /\b(delete|remove|void|decline|reject|deactivate|discard|clear|leave without|cancel this)\b/i.test(o.msg || "");
    const esc2 = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    w.innerHTML = `<div class="slk-ask-b"><p>${esc2(o.msg)}</p>${o.input !== undefined ? `<input class="slk-ask-i" value="${esc2(o.input)}" autocomplete="off">` : ""}
      <div class="slk-ask-f"><button type="button" class="slk-ask-no">${esc2(o.no)}</button><button type="button" class="slk-ask-yes${danger ? " red" : ""}">${esc2(o.yes)}</button></div></div>`;
    const prev = document.activeElement;
    const done = v => { document.removeEventListener("keydown", key, true); w.remove(); try{ prev?.focus?.(); }catch(e){} res(v); };
    const ok = () => done(o.input !== undefined ? w.querySelector(".slk-ask-i").value : true), no = () => done(o.input !== undefined ? null : false);
    const key = e => { if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); no(); } else if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); ok(); } };
    w.addEventListener("click", e => { if(e.target === w || e.target.closest(".slk-ask-no")) no(); else if(e.target.closest(".slk-ask-yes")) ok(); });
    document.addEventListener("keydown", key, true);
    document.body.appendChild(w);
    setTimeout(() => { const i = w.querySelector(".slk-ask-i"); if(i){ i.focus(); i.select(); } else w.querySelector(".slk-ask-yes").focus(); }, 0);
  });
}
function askYes(msg){ return askDlg({ msg, yes:"Yes", no:"No" }); }
// why an order (or a change to it) is turned down: the reasons from Manage → Reasons, or one written by hand
function askReason(title, reasons, yes){
  return new Promise(res => {
    const w = document.createElement("div"); w.className = "slk-ask"; w.setAttribute("role", "dialog"); w.setAttribute("aria-modal", "true");
    const e2 = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); let pick = "";
    w.innerHTML = `<div class="slk-ask-b" style="max-width:520px;width:calc(100% - 32px)"><p style="font-weight:700">${e2(title)}</p><div class="rchips" style="margin:4px 0 10px">${reasons.map(x => `<button type="button" data-rr="${e2(x)}">${e2(x)}</button>`).join("")}<button type="button" data-rr="_other">Other…</button></div>
      <input class="slk-ask-i" placeholder="Write the reason" autocomplete="off" style="display:${reasons.length ? "none" : ""}"><div class="rrerr" style="color:#b42318;font-size:13px;min-height:18px"></div>
      <div class="slk-ask-f"><button type="button" class="slk-ask-no">Cancel</button><button type="button" class="slk-ask-yes red">${e2(yes || "Reject")}</button></div></div>`;
    const inp = w.querySelector(".slk-ask-i"); if(!reasons.length) pick = "_other";
    const done = v => { document.removeEventListener("keydown", key, true); w.remove(); res(v); };
    const ok = () => { const v = pick==="_other" ? inp.value.trim() : pick; if(!v){ w.querySelector(".rrerr").textContent = "Choose a reason."; return; } done(v); };
    const key = e => { if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); done(null); } else if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); ok(); } };
    w.addEventListener("click", e => { const c = e.target.closest("[data-rr]");
      if(c){ pick = c.dataset.rr; w.querySelectorAll("[data-rr]").forEach(b => b.classList.toggle("on", b===c)); inp.style.display = pick==="_other" ? "" : "none"; if(pick==="_other") inp.focus(); w.querySelector(".rrerr").textContent = ""; return; }
      if(e.target === w || e.target.closest(".slk-ask-no")) done(null); else if(e.target.closest(".slk-ask-yes")) ok(); });
    document.addEventListener("keydown", key, true); document.body.appendChild(w);
  });
}

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// modifiers shown as a list under the product: one line per option ("2× Cheese"), then the item note
const modLines = (i, hideFree) => { if(Array.isArray(i.options) && i.options.length){ const t = []; i.options.forEach(x => { if(hideFree && !(+x.price)) return; const f = t.find(y => y.name===x.name); if(f) f.n++; else t.push({ name:x.name, n:1 }); }); return [...t.map(x => (x.n > 1 ? x.n + "× " : "") + x.name), ...(i.note ? ["Note: " + i.note] : [])]; }
  return String(i.mods||"").split(" · ").flatMap(p => p.startsWith("Note: ") ? [p] : p.split(", ")).map(x => x.trim()).filter(Boolean); };
const modList = (i, rmIx) => { const l = modLines(i); return l.length ? `<ul class="mlist">${l.map(x => x.startsWith("Note: ") ? `<li class="mn">${esc(x)}${rmIx!=null ? `<button type="button" class="mnx" data-rmnote="${rmIx}" aria-label="Remove note">×</button>` : ""}</li>` : `<li>${esc(x)}</li>`).join("")}</ul>` : ""; };
const coS = () => { try{ return S.settings.find(x=>x.id==="company") || {}; }catch(e){ return {}; } };
const DEC = () => { const d = coS().priceDecimals; return d===0||d==="0" ? 0 : +d || 2; };
const SYM = () => String(coS().currencySymbol || "").trim() || coS().currency || "USD";
const CURJ = (s, n) => /[\p{L}.]$/u.test(s) ? s + " " + n : s + n;   // a code or word ("USD", "L.L.") gets a space, a symbol ("$") sits against the number
const usd = n => CURJ(SYM(), (+n||0).toLocaleString("en-US",{minimumFractionDigits:DEC(),maximumFractionDigits:DEC()}));
const CUR2 = () => { const c = coS(); return c.currency2 && +c.rate2 ? { code: c.currency2, rate: +c.rate2, dec: +c.decimals2 || 0 } : null; };
const num2 = (n, d) => (+n||0).toLocaleString("en-US", { minimumFractionDigits: +d||0, maximumFractionDigits: +d||0 });
const ceilD = (n, d) => { const f = Math.pow(10, d); return Math.ceil(n * f - 1e-7) / f; };
// Currency → Rounding rules: the last digit at the currency's decimals is rounded up or down by the rule that covers it
const rrApply = (v, dec, rules) => { if(!rules || !rules.length) return v; const f = Math.pow(10, dec), x = Math.round(Math.abs(+v||0) * f), dg = x % 10, r = rules.find(r => dg >= +r.from && dg <= +r.to); if(!r || !dg) return v; return Math.sign(v) * (r.up ? x - dg + 10 : x - dg) / f; };
const due2 = t => { const c = CUR2(); return c ? rrApply(ceilD(t * c.rate, c.dec), c.dec, coS().roundRules2) : 0; };   // what the customer pays in the secondary currency
const chg2 = t => { const c = CUR2(); return c ? rrApply(Math.floor(t * c.rate * Math.pow(10, c.dec) + 1e-7) / Math.pow(10, c.dec), c.dec, coS().roundRules2) : 0; };   // change given in the secondary currency
const usd2 = n => { const c = coS(); if(!c.currency2 || !(+c.rate2)) return ""; const d = +c.decimals2 || 0; return CURJ(String(c.currencySymbol2 || "").trim() || c.currency2, rrApply((+n||0) * +c.rate2, d, c.roundRules2).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})); };
(() => { const P = Date.prototype, ls = P.toLocaleString, lt = P.toLocaleTimeString;   // 12-hour clock on screen and receipts
  P.toLocaleString = function(l, o){ return ls.call(this, l || "en-GB", { hour12:true, ...(o||{}) }).replace(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/, (m, d, mo, y) => d.padStart(2,"0") + "-" + mo.padStart(2,"0") + "-" + y); };   // dates as dd-mm-yyyy (receipts too)
  P.toLocaleTimeString = function(l, o){ return lt.call(this, l || "en-GB", { hour12:true, ...(o||{}) }); }; })();
// delivery address parts, stored as one line: "[Home] Hamra, Bliss St · Bldg: … · Floor: … · Info: …"
const ADDR_K = ["label","street","building","floor","door","extra"];
const addrJoin = a => { const c = v => String(v||"").replace(/\s*·\s*/g, ", ").trim(); return [c(a.label) ? "[" + c(a.label).replace(/[\[\]]/g,"") + "]" : "", [c(a.street), c(a.building) && "Bldg: " + c(a.building), c(a.floor) && "Floor: " + c(a.floor), c(a.door) && "Door: " + c(a.door), c(a.extra) && "Info: " + c(a.extra)].filter(Boolean).join(" · ")].filter(Boolean).join(" "); };
const show = id => ["boot","activate","app"].forEach(x => $("#"+x).classList.toggle("hide", x!==id));
// no example text inside fields that need filling (search boxes keep theirs)
const noHints = () => document.querySelectorAll("input[placeholder], textarea[placeholder]").forEach(el => { if(!el.matches("#ovQ, .search, [type=search], [data-ph]")) el.removeAttribute("placeholder"); });

const userPerms = u => { const ids = (u?.roleIds||[]).length ? u.roleIds : [u?.roleId]; return S.roles.filter(r => ids.includes(r.id) && !r.deleted).flatMap(r => r.permissions||[]); };

const LATE_MIN = 5;
const shMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t||""); return m ? +m[1]*60 + +m[2] : 0; };
const shSpan = x => { const a = shMin(x.startTime); let b = shMin(x.endTime); if(b <= a) b += 1440; const d0 = +new Date(x.day + "T00:00:00"); return [d0 + a*60000, d0 + b*60000]; };
const shDay = (t = new Date()) => { const d = new Date(t); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const myShifts = u => (S.work_shifts||[]).filter(x => !x.deleted && x.published && x.employeeId===u.id).sort((a,b) => shSpan(a)[0] - shSpan(b)[0]);
// the shift this clock-in belongs to: one that is on now, or starts within 3 hours, at this branch first
function shiftFor(u, at = Date.now()){ const list = myShifts(u).filter(x => { const [a, b] = shSpan(x); return at >= a - 3*3600000 && at <= b; });
  return list.find(x => x.branchId===device.branchId) || list[0] || null; }
const hm = t => new Date(t).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
function shiftsHtml(u){ const now = Date.now(), up = myShifts(u).filter(x => shSpan(x)[1] >= now).slice(0, 4); if(!up.length) return `<p class="lkst">No upcoming shifts</p>`;
  const bn = id => (S.branches.find(b => b.id===id)||{}).name || ""; const dl = x => x.day===shDay() ? "Today" : x.day===shDay(now + 86400000) ? "Tomorrow" : new Date(x.day + "T12:00:00").toLocaleDateString("en-GB", { weekday:"short", day:"2-digit", month:"2-digit" }).replace(/\//g, "-");
  return `<div class="lkshifts"><b>Your Shifts</b>${up.map(x => `<div><span>${esc(dl(x))}</span><span>${esc(String(x.startTime).slice(0,5))} – ${esc(String(x.endTime).slice(0,5))}</span><small>${esc([x.jobTitle, x.branchId!==device.branchId ? bn(x.branchId) : ""].filter(Boolean).join(" · "))}</small></div>`).join("")}</div>`; }

async function tcToggle(){
  const u = WELC; if(!u) return; const d = tcDoc(), open = { ...(d.open || {}) }, log = [...(d.log || [])], now = new Date().toISOString(), o = open[u.id];
  let note = "";
  if(o){ const e = { userId:u.id, name:u.name, branchId:o.branchId, deviceId:o.deviceId, in:o.at, out:now };
    ["shiftId","late","unscheduled"].forEach(k => { if(o[k] != null) e[k] = o[k]; });
    const sh = o.shiftId && (S.work_shifts||[]).find(x => x.id===o.shiftId); if(sh){ const early = Math.round((shSpan(sh)[1] - Date.now()) / 60000); if(early > LATE_MIN){ e.earlyOut = early; note = ` · ${early} min early`; } }
    log.push(e); delete open[u.id]; }
  else { const sh = shiftFor(u), n = { at:now, branchId:device.branchId, deviceId:device.id, name:u.name };
    if(sh){ n.shiftId = sh.id; const late = Math.round((Date.now() - shSpan(sh)[0]) / 60000); if(late > LATE_MIN){ n.late = late; note = ` · ${late} min late`; } }

  const ex = S.settings.find(x => x.id==="timeclock"); if(ex) Object.assign(ex, next); else S.settings.push({ id:"timeclock", ...next });
  try{ await db.collection("settings").doc("timeclock").set(next); }catch(e){ console.warn("time clock", e); toast("Saved on this tablet · will sync when online"); }

}

/* ---------- order numbers: each tablet counts 1, 2, 3… and starts again every business day ---------- */
// the business day starts at this branch's own time (Manage → Branches); the old company-wide setting is the fallback
const dayCut = () => { const b = (typeof branch!=="undefined" && branch) || null, v = b?.settings?.dayStart || (S.settings.find(x=>x.id==="company")||{}).dayEnd || "";
  const m = /^(\d{1,2}):(\d{2})/.exec(v); return m ? Math.min(719, (+m[1])*60 + (+m[2])) : 0; };
const nextDay = d => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + 1); return x.toISOString().slice(0,10); };
// ending the day early (before the start time) starts the next business day right then
const bizDate = (t = new Date()) => { const ms = +new Date(t), d0 = new Date(ms - dayCut()*60000); let d = new Date(d0 - d0.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const bid = (typeof device!=="undefined" && device?.branchId) || null;
  if(bid && S.day_closes.length) for(let i = 0; i < 3; i++){ const c = S.day_closes.find(c => c.branchId===bid && String(c.businessDate).slice(0,10)===d); if(c && +new Date(c.closedAt) <= ms) d = nextDay(d); else break; }
  return d; };
// call number: one sequence per branch (all registers), starting again at 1 after each end of day; the server fixes any clash
function nextOrderNo(){
  const since = S.day_closes.filter(c => c.branchId===device.branchId).reduce((m,c) => Math.max(m, +new Date(c.closedAt) || 0), 0);
  const key = "skwydNo_" + device.branchId; let c = {}; try{ c = JSON.parse(store.get(key) || "{}"); }catch(e){}
  let n = c.since===since ? +c.n||0 : 0;
  // the latest order of the day (not the highest number), so the sequence carries on after it wraps at Call Number Reset
  let last = null; S.orders.forEach(o => { if(o.branchId===device.branchId && o.no && o.status!=="refund" && +new Date(o.createdAt) > since && (!last || +new Date(o.createdAt) > +new Date(last.createdAt))) last = o; });
  if(last && (!c.at || +new Date(last.createdAt) > c.at)) n = parseInt(String(last.no).replace(/\D/g,""),10)||0;
  // Device Settings: Call Number Start / Call Number Reset
  const st = Math.max(1, +devSet().callStart || 1), rs = +devSet().callReset || 0;
  n = n < st - 1 ? st - 1 : n; n++; if(rs && n > rs) n = st;
  store.set(key, JSON.stringify({ since, n, at: Date.now() })); return String(n);
}

function giveBackNo(no){ const key = "skwydNo_" + device.branchId; try{ const c = JSON.parse(store.get(key) || "{}"); if(String(c.n)===String(no)){ c.n = +no - 1; store.set(key, JSON.stringify(c)); } }catch(e){} }

const APP_DEF = { requireCustPickup:true, requireCustDelivery:true, requireTable:false, stockAction:"ask", reasonRequired:true, discountApproval:false, rcptInvoice:true, rcptCustomer:true, rcptTax:true, rcptSource:false,

const BRAND_POS_DEF = { showOrderNo:true, showSubtotal:true, phoneOnPickup:true, printLang:"main", returnMode:"unlimited", returnMinutes:1440, kitchenSort:"added", presetTender:"", logoutMinutes:10 };
const appSet = () => { const a = { ...APP_DEF, ...BRAND_POS_DEF, ...(S.settings.find(x=>x.id==="app")||{}), ...(S.settings.find(x=>x.id==="brand_" + (branch?.brandId || ""))||{}) };
  if(a.requireTableGuests !== undefined) a.requireTable = !!a.requireTableGuests; return a; };
const custGiven = (n, p) => !!(String(n||"").trim() || String(p||"").replace(/[^0-9]/g,"").length >= 6);
const typeKey = t => t==="takeaway" ? "pickup" : t==="fast" ? "dinein" : t;   // older "fast" orders count as Dine-in
// Dine-in without a table: paid straight away (it can't be saved for later until it has a table)
const noTable = () => otype==="dinein" && !tableNo;
const menuType = () => otype==="takeaway" ? "pickup" : otype;
const chargeList = type => S.charges.filter(c => !c.deleted && (!(c.orderTypes||[]).length || c.orderTypes.includes(typeKey(type)))
  && (!(c.brandIds||[]).length || c.brandIds.includes(branch?.brandId)) && (!(c.branchIds||[]).length || c.branchIds.includes(device.branchId))).sort((a,b)=>(a.sort??999)-(b.sort??999)||a.name.localeCompare(b.name));

// a tax counts only on the order types it applies to (none picked = every type)
const taxOn = x => { const l = x.orderTypes || []; if(!l.length) return true; return l.includes(typeKey(otype)); };
const chgRates = c => { const g = c?.taxGroup && S.tax_groups.find(x => x.id===c.taxGroup && live(x)), r = { inc:0, exc:0 }; (g?.taxIds||[]).forEach(t => { const x = S.taxes.find(y => y.id===t && live(y)); if(x && taxOn(x)) r[x.inclusive===false ? "exc" : "inc"] += (+x.rate||0)/100; }); return r; };
const lineNet = i => Math.max(0, (+i.price||0) * (+i.qty||1) - (+i.disc||0));
/* ---------- tax (prices include it, unless the company turned tax-inclusive pricing off) ---------- */
// each tax is either inclusive (already inside the menu price) or added on top (Manage → Taxes & Groups)
const prodRates = id => { const p = S.products.find(x=>x.id===id), g = p && S.tax_groups.find(x=>x.id===(p.taxGroup || brSet().taxGroup) && live(x)), r = { inc:0, exc:0 };
  (g?.taxIds||[]).forEach(t => { const x = S.taxes.find(y=>y.id===t && live(y)); if(x && taxOn(x)) r[x.inclusive===false ? "exc" : "inc"] += (+x.rate||0)/100; }); return r; };
// tax = inclusive part taken out of the price + exclusive part added on the price before tax; "added" is what goes on top of the total
function orderTaxParts(items, disc){ let g = 0, t = 0, add = 0; (items||[]).forEach(i => { const l = lineNet(i), r = prodRates(i.productId), base = l/(1+r.inc); g += l; t += (l - base) + base*r.exc; add += base*r.exc; });
  if(g>0 && disc>0){ const k = 1 - Math.min(disc,g)/g; t *= k; add *= k; } return { tax:+t.toFixed(2), added:+add.toFixed(2) }; }
const taxIncl = () => !S.taxes.some(x => live(x) && x.inclusive===false);

let AUD = null;
document.addEventListener("pointerdown", () => { try{ AUD ||= new (window.AudioContext || window.webkitAudioContext)(); if(AUD.state==="suspended") AUD.resume(); }catch(e){} }, { capture:true });
function whistle(){
  try{ if(localStorage.getItem("skwyd_sound")==="off") return; }catch(e){}
  try{ AUD ||= new (window.AudioContext || window.webkitAudioContext)(); if(AUD.state==="suspended") AUD.resume();
    const t0 = AUD.currentTime + 0.05, g = AUD.createGain(); g.connect(AUD.destination); g.gain.setValueAtTime(0.0001, t0);
    const note = (start, dur, f) => { const o = AUD.createOscillator(); o.type = "sine"; o.connect(g); o.frequency.setValueAtTime(f[0], start);
      f.slice(1).forEach((x, i) => o.frequency.exponentialRampToValueAtTime(x, start + dur * (i + 1) / (f.length - 1)));
      g.gain.exponentialRampToValueAtTime(0.35, start + 0.04); g.gain.setValueAtTime(0.35, start + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, start + dur); o.start(start); o.stop(start + dur + 0.02); };
    note(t0, 0.32, [1100, 2600]); note(t0 + 0.45, 0.55, [1000, 2400, 1300]);   // "wheet-whee-oo"
  }catch(e){}
}

async function editLine(ix, only){   // only: "note" (tap: options and note) or "disc" (long press: the discount)
  const i = cart[ix], p = i && S.products.find(x=>x.id===i.productId); if(!i || !window.SkwydMods) return;
  const base = (+i.price||0) - (i.options||[]).reduce((t,x)=>t+(+x.price||0),0);   // the item's own price, before its options
  const r = await SkwydMods.pick({ name:i.name, basePrice:base, ...(p && !i.saved ? modData(p) : { links:[], groups:{}, options:[] }), money:usd, edit:true, only, initial:i.options||[], qty:i.qty,
    ...(only==="mods" ? { qtyEdit:true, minQty: Math.max(1, i.saved||0), canRemove: !i.saved } : {}), note:i.note||"", allowDiscount: can("pos_item_discount"), discType:i.discType, discValue:i.discValue }); if(!r) return;
  if(r.remove){ cart.splice(ix, 1); renderCart(); renderMenu(); return; }
  if(+r.disc > (+i.disc||0) + 0.001 && appSet().discNeedsCustomer && !custGiven(cust.name, cust.phone)){ toast("Add the customer first: discounts need customer info"); return; }
  if(+r.disc > (+i.disc||0) + 0.001 && appSet().discountApproval && !(await approve("pos_item_discount", "Approve item discount"))) return;
  if(i.saved){ if(r.disc != null){ i.disc = r.disc; i.discType = r.discType; i.discValue = r.discValue; if(!+i.disc){ delete i.disc; delete i.discType; delete i.discValue; } } renderCart(); return; }   // sent to the kitchen: only its discount changes
  Object.assign(i, { price:r.unitPrice, qty:r.qty, options:r.options, note:r.note, mods:SkwydMods.label(r.mods, r.note) });
  if(r.disc != null){ i.disc = r.disc; i.discType = r.discType; i.discValue = r.discValue; } else reDisc(i);
  if(!i.options.length) delete i.options; if(!i.note) delete i.note; if(!i.mods) delete i.mods; if(!+i.disc){ delete i.disc; delete i.discType; delete i.discValue; }
  renderCart();
}

/* ---------- Drivers: today's delivery orders per driver, with totals ---------- */
// cash a driver collected from customers and hasn't handed to the cashier yet: closed delivery orders paid in cash, not received
const drvCashOwed = o => o.type==="delivery" && o.driverId && o.status==="closed" && (o.payment?.type || o.payment?.method)==="cash" && !o.driverSettledAt;
const owedTotal = l => +l.filter(drvCashOwed).reduce((s,o) => s + (+o.total||0), 0).toFixed(2);
function openDrivers(){
  const day = bizDate(), mine = S.orders.filter(o => o.branchId===device.branchId && o.type==="delivery" && bizDate(o.createdAt)===day && !["void","declined"].includes(o.status));
  const byDrv = {}; mine.filter(o => o.driverId).forEach(o => { (byDrv[o.driverId] ||= { name: o.driverName, l: [] }).l.push(o); });
  driverList().forEach(u => { if(!byDrv[u.id]) byDrv[u.id] = { name: u.name, l: [] }; });
  const none = mine.filter(o => !o.driverId && o.status!=="closed");
  const rows = Object.entries(byDrv).sort((a,b) => b[1].l.length - a[1].l.length || String(a[1].name).localeCompare(String(b[1].name)));
  const tot = l => l.reduce((s,o) => s + (+o.total||0), 0), cash = l => l.filter(o => o.status==="closed" && (o.payment?.type || o.payment?.method)==="cash").reduce((s,o) => s + (+o.total||0), 0);
  const line = o => `<div class="drl" role="button" tabindex="0" data-ov="${esc(o.id)}"><b>${esc(o.ref || ordRef(o))}</b><span>${esc(o.customerName || "—")}</span>${o.driverSettledAt ? `<span class="spill s-closed" title="Cash received">Cash received</span>` : ""}<span class="spill s-${o.driverStatus==="picked" ? "out" : o.status}">${esc(o.status==="closed" ? "Delivered" : DRV_ST[o.driverStatus] ? DRV_ST[o.driverStatus][0].toUpperCase() + DRV_ST[o.driverStatus].slice(1) : stLbl(o))}</span><em>${usd(o.total)}</em></div>`;
  modal("drivers", `<div class="ohdr"><button class="hbtn" data-drvback>Back</button><b style="font-size:18px">Drivers · Today</b><span class="sp"></span></div><div class="mb">
    <div class="drvsum"><div><small>Delivery orders</small><b>${mine.length}</b></div><div><small>Total</small><b>${usd(tot(mine))}</b></div><div><small>Without a driver</small><b>${none.length}</b></div></div>
    ${rows.map(([id, d]) => `<div class="drvc${DRV_OPEN.has(id) ? " open" : ""}" data-drvc="${esc(id)}"><div class="drvh" role="button" tabindex="0" data-drvx="${esc(id)}" title="Show or hide the orders"><svg class="drvchev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><b>${esc(d.name)}</b><span class="mut">${d.l.length} order${d.l.length===1 ? "" : "s"}</span><span class="sp"></span><span class="mut">Total</span><b>${usd(tot(d.l))}</b><span class="mut" style="margin-left:10px">Cash collected</span><b>${usd(cash(d.l))}</b>${owedTotal(d.l) ? `<span class="mut" style="margin-left:10px">With driver</span><b style="color:#b54708">${usd(owedTotal(d.l))}</b><button class="hbtn" style="margin-left:10px" data-drvrecv="${esc(id)}">Receive Cash</button>` : ""}</div>
      <div class="drvls">${d.l.length ? d.l.sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt))).map(line).join("") : `<p class="mut" style="margin:6px 0 0">No orders today</p>`}</div></div>`).join("") || `<p class="mut">No drivers yet. Give employees a role with "Use Driver App" in the back office.</p>`}
    ${none.length ? `<div class="drvc"><div class="drvh"><b>Waiting for a driver</b></div>${none.map(line).join("")}</div>` : ""}</div>`, true);
  $("#modal").classList.add("full"); $("#scrim").classList.add("fullscr");
}

// Receive Cash: the driver hands over the cash of their delivered orders; it is recorded on each order (who received it and when)
async function receiveDriverCash(id){
  const l = S.orders.filter(o => o.driverId===id && o.branchId===device.branchId && drvCashOwed(o)), amt = owedTotal(l), name = l[0]?.driverName || "the driver";
  if(!l.length) return toast("Nothing to receive");
  if(!(await askYes(`Receive ${usd(amt)} from ${name} for ${l.length} order${l.length===1 ? "" : "s"}?`, "Receive Cash"))) return;
  const now = new Date().toISOString(), by = cashier?.name || device.name;
  try{ for(const o of l) await db.collection("orders").doc(o.id).update({ driverSettledAt: now, driverSettledBy: by, updatedAt: now }); toast(`${usd(amt)} received from ${name}`); openDrivers(); }
  catch(err){ console.error(err); toast("Couldn't save. Try again.", true); }
}

/* on-screen keyboard (skwyd design): used on the POS tablet instead of the system keyboard, so typing looks the same on every
   device and never covers half the register. Letters (English / Arabic), numbers & symbols, and a number pad for number fields.
   Keys react on touch-down, ⌫ repeats when held, ⇧ twice = caps lock. Turn it off on a device with localStorage skwyd_osk = "off". */
const oskAuto = () => { try{ if(localStorage.getItem("skwyd_osk") === "off") return false;
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if(ios) return false;   // iPad / iPhone keep their own keyboard
  return true; }catch(e){ return true; } };   // on by default everywhere else (tablet app and web); a physical keyboard still types as usual
let OSK_ON = oskAuto();
const OSK = { el:null, target:null, shift:false, caps:false, mode:"abc", lang:(()=>{ try{ return localStorage.getItem("skwyd_osk_lang") || "en"; }catch(e){ return "en"; } })(), kind:"text", lastShift:0, rep:null };

/* ---------- approval with a manager's PIN ---------- */
function approve(perm, title){
  if(!usePins()) return Promise.resolve({ name: cashier?.name || device.name });
  if(isAdminUser(cashier)) return Promise.resolve({ name: cashier.name, id: cashier.id });   // owners and admins never need a second PIN
  return new Promise(resolve => {
    let buf = ""; const el = document.createElement("div"); el.className = "apv";
    const draw = err => { el.innerHTML = `<div class="apvbox"><h2>${esc(title)}</h2><p class="mut">A manager whose role allows this, or an admin, types their PIN.</p><div class="pindots">${[0,1,2,3,4].map(i=>`<i class="${i<buf.length?"on":""}"></i>`).join("")}</div>
      <div class="err" style="min-height:20px;color:#b42318">${esc(err||"")}</div><div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-ap="${n}">${n}</button>`).join("")}<button data-ap="c">C</button><button data-ap="0">0</button><button data-ap="b">⌫</button></div>
      <button class="btn" data-apx style="margin-top:12px;width:100%">Cancel</button></div>`; };
    const done = v => { el.remove(); document.removeEventListener("keydown", key, true); resolve(v); };
    const check = async () => { const pin = buf, u = await pinUser(S.users.filter(u => !u.deleted && u.active!==false && u.pinHash), pin);
      if(!u && pin.length < 5) return;
      buf = "";
      if(!u) return draw("Wrong PIN. Try again.");
      if(isAdminUser(u) || userPerms(u).includes(perm)) return done(u);
      return draw(`${u.name}'s role can't approve this.`); };
    const press = k => { if(k==="c") buf = ""; else if(k==="b") buf = buf.slice(0,-1); else if(buf.length < 5) buf += k; draw(); if(buf.length>=4) check(); };
    const key = e => { if(/^\d$/.test(e.key)){ e.stopPropagation(); press(e.key); } else if(e.key==="Backspace"){ e.stopPropagation(); press("b"); } else if(e.key==="Escape") done(null); };
    el.addEventListener("click", e => { const b = e.target.closest("[data-ap]"); if(b) return press(b.dataset.ap); if(e.target.closest("[data-apx]") || e.target===el) done(null); });
    document.addEventListener("keydown", key, true); draw(); document.body.appendChild(el);
  });
}
