const isNet = e => !navigator.onLine || /fetch|network|Failed to fetch|Load failed|timeout/i.test(String(e?.message || e || ""));
// clock punches made without internet wait here (time + GPS from the phone) and are sent in order when the connection is back
const Q = () => LS.get("skwyd_team_q", []), setQ = q => { LS.set("skwyd_team_q", q); paintQ(); };
const meCache = m => { if(m) LS.set("skwyd_team_me", m); return m; };
const distM = (a, b, c, d) => { const r = x => x * Math.PI / 180, h = Math.sin(r(c - a)/2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b)/2) ** 2; return 6371000 * 2 * Math.asin(Math.sqrt(h)); };
// clocked in right now? the server's answer, then any punches still waiting to be sent
const openNow = () => { let o = S.me?.open || null; Q().forEach(p => { o = p.in ? { at:p.at, branchId:p.branchId, pending:true } : null; }); return o; };
function paintQ(){ const n = Q().length, el = $("#cq"); if(el){ el.hidden = !n; el.textContent = n ? `${n} punch${n > 1 ? "es" : ""} saved on this phone · ${navigator.onLine ? "sending…" : "will sync when you're online"}` : ""; } }
let syncing = false;
async function sync(){
  if(syncing || !navigator.onLine || !Q().length) return; syncing = true; let changed = false;
  try{ while(Q().length){ const p = Q()[0]; let r;
      try{ r = await rpc("skwyd_team_punch", { p_lat:p.lat, p_lng:p.lng, p_acc:p.acc, p_at:p.at, p_in:p.in }); }
      catch(e){ if(isNet(e)) break; r = { error: e.message || "Couldn't send a saved punch.", drop:true }; }
      if(r?.error){ toast(`Saved ${p.in ? "clock in" : "clock out"} at ${hm(p.at)}: ${r.error}`, "bad"); }
      setQ(Q().slice(1)); changed = true; }
    if(changed){ S.me = meCache(await rpc("skwyd_team_me")) || S.me; if(S.tab==="clock") viewClock(); else if(S.tab==="hrs") viewHrs(); if(!Q().length) toast("Saved punches synced", "ok"); } }
  catch(_){} finally{ syncing = false; }
}
addEventListener("online", () => { paintQ(); sync(); }); addEventListener("offline", paintQ); setInterval(sync, 30000);

  const { data:{ session } } = await sb.auth.getSession(); if(!session) return loginView();
  let net = true; try{ S.me = meCache(await rpc("skwyd_team_me")); }catch(e){ console.error(e); net = false; S.me = LS.get("skwyd_team_me", null);   // offline: the copy saved on this phone
    if(!S.me){ app.innerHTML = `<div class="login"><div class="brand">${MARK}</div><p class="empty">No internet connection.<br><button class="btn sm" style="margin:14px auto 0" onclick="location.reload()">Try Again</button></p></div>`; return; } }
  if(!S.me){ await sb.auth.signOut(); return loginView("This login isn't active. Ask your manager."); }
  if(net) sync();
  shell(); go(S.tab); if(net){ chatDot(); kbLoad(); } if(DRIVER) drvPoll();
}

/* ---------- clock in / out (GPS at the branch) ---------- */
let clk = 0;
async function viewClock(){
  clearInterval(clk);
  const o = openNow(), br = o ? (S.me.branches.find(b => b.id===o.branchId)?.name || "") : "";
  let next = null; try{ const today = new Date(); const l = await rpc("skwyd_team_shifts", { p_from: ymd(today), p_to: ymd(addD(today, 14)) }); next = l.find(x => new Date(x.day + "T" + t5(x.end) + ":00") > new Date() || x.day > ymd(today)) || null; }catch(_){}
  main().innerHTML = `<div class="card clock"><div class="now" id="cnow">${hm(new Date())}</div><div class="date">${new Date().toLocaleDateString("en-GB", { weekday:"long" })} · ${dmy(new Date())}</div>
      <button class="cbtn ${o ? "outb" : ""}" id="cb">${ic(o ? "out" : "in")}${o ? "Clock Out" : "Clock In"}</button>
      <div><span class="st ${o ? "on" : ""}"><i></i>${o ? `Clocked in since ${hm(o.at)}${br ? " · " + esc(br) : ""}` : "Not clocked in"}</span></div>
      <div class="loc" id="cq" style="color:var(--warn);font-weight:600" hidden></div><div class="loc" id="cloc">${ic("pin").replace("<svg", '<svg style="width:14px;height:14px;vertical-align:-2px"')} Your location is checked when you press the button</div></div>
    <button class="btn ghost" style="margin-bottom:14px" id="myh">${ic("hrs").replace("<svg", '<svg style="width:18px;height:18px"')} My Hours</button><div class="card"><h2 style="margin-top:0">Next Shift</h2>${next ? `<div class="kv"><span>Day</span><b>${next.day===ymd(new Date()) ? "Today" : new Date(next.day + "T12:00:00").toLocaleDateString("en-GB", { weekday:"long" }) + " " + dmy(next.day)}</b></div><div class="kv"><span>Time</span><b>${t5(next.start)} – ${t5(next.end)}</b></div><div class="kv"><span>Branch</span><b>${esc(next.branch || "—")}</b></div>${next.jobTitle ? `<div class="kv"><span>Job</span><b>${esc(next.jobTitle)}</b></div>` : ""}` : `<p class="empty" style="padding:6px">No upcoming shifts</p>`}</div>`;
  clk = setInterval(() => { const n = $("#cnow"); if(n) n.textContent = hm(new Date()); else clearInterval(clk); }, 10000);
  $("#cb").onclick = clockPress; paintQ(); const mh = $("#myh"); if(mh) mh.onclick = () => { S.tab = "hrs"; document.querySelectorAll("[data-tab]").forEach(b => b.classList.remove("on")); viewHrs(); };
}
function here(){ return new Promise((res, rej) => { if(!navigator.geolocation) return rej(new Error("Location isn't available on this phone."));
  navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? "Allow location for SKWYD Team to clock in (phone Settings → Apps → SKWYD Team → Permissions)." : e.code === 3 ? "Couldn't get your location in time. Go near a window and try again." : "Couldn't get your location. Turn on Location and try again.")),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }); }); }
async function clockPress(){
  const b = $("#cb"), goIn = !openNow(); b.disabled = true; const lbl = b.innerHTML; b.innerHTML = `<span class="spin"></span><span style="font-size:14px">Checking location…</span>`;
  const fail = m => { toast(m, "bad"); b.disabled = false; b.innerHTML = lbl; const l = $("#cloc"); if(l) l.textContent = m; };
  let c; try{ c = await here(); }catch(e){ return fail(e.message); }   // GPS works without internet
  // check the distance on the phone too, so an offline punch isn't saved from the wrong place
  const near = (S.me.branches||[]).filter(x => x.lat != null && x.lng != null).map(x => ({ ...x, m: distM(c.latitude, c.longitude, +x.lat, +x.lng) })).sort((a, z) => a.m - z.m)[0];
  if(!near) return fail("Your branch has no location yet. Ask your manager to set it in Manage → Branches.");
  if(near.m > 150 + Math.min(c.accuracy || 0, 100)) return fail(`You are ${Math.round(near.m)} m from ${near.name}. Clock in at the branch.`);
  const punch = { lat:c.latitude, lng:c.longitude, acc:c.accuracy, at:new Date().toISOString(), in:goIn, branchId:near.id };
  const save = () => { setQ([...Q(), punch]); toast(`${goIn ? "Clocked in" : "Clocked out"} at ${hm(punch.at)} · saved on this phone, will sync when you're online`, "ok"); viewClock(); };
  if(!navigator.onLine || Q().length) return save();   // offline, or older punches still waiting: keep the order
  try{ const r = await rpc("skwyd_team_punch", { p_lat:punch.lat, p_lng:punch.lng, p_acc:punch.acc, p_at:punch.at, p_in:punch.in });
    if(r?.error) return fail(r.error);
    toast(r.clockedIn ? `Clocked in at ${r.branch}${r.late ? " · " + r.late + " min late" : ""}` : `Clocked out · ${r.branch}`, "ok");
    S.me = meCache(await rpc("skwyd_team_me")); viewClock(); }
  catch(e){ if(isNet(e)) return save(); fail(e.message || "Something went wrong"); }
}

  main().innerHTML = `<div class="wk"><button id="wp" aria-label="Previous week">‹</button><b>${dmy(a)} – ${dmy(z)}</b><button id="wn" aria-label="Next week">›</button></div><div class="card" id="sc"><p class="empty">Loading…</p></div>`;
  $("#wp").onclick = () => { S.week = addD(S.week, -7); viewSched(); }; $("#wn").onclick = () => { S.week = addD(S.week, 7); viewSched(); };
  try{ S.shifts = await rpc("skwyd_team_shifts", { p_from: ymd(a), p_to: ymd(z) }); }catch(e){ $("#sc").innerHTML = `<p class="empty">Couldn't load your schedule.</p>`; return; }
  try{ if(!S.reqs.length) S.reqs = await rpc("skwyd_team_requests"); }catch(_){}

  document.querySelectorAll("[data-swap]").forEach(b => b.onclick = () => swapSheet(S.shifts.find(x => x.id===b.dataset.swap)));

  sheet(`<h3>Swap Shift</h3><p class="note" style="margin-top:-6px">${dmy(x.day)} · ${t5(x.start)} – ${t5(x.end)}${x.branch ? " · " + esc(x.branch) : ""}</p>
    <div class="f"><label for="sw">Give it to <b>*</b></label><select class="in" id="sw"><option value="">Choose a colleague…</option>${S.mates.map(m => `<option value="${esc(m.id)}">${esc(m.name)}${m.jobTitle ? " · " + esc(m.jobTitle) : ""}</option>`).join("")}</select></div>

  $("#ss").onclick = async () => { const w = $("#sw").value; if(!w) return $("#se").textContent = "Choose a colleague.";
    $("#ss").disabled = true; try{ const r = await rpc("skwyd_team_request", { p: { kind:"swap", shiftId:x.id, swapWith:w, note:$("#sn").value } }); if(r?.error){ $("#se").textContent = r.error; $("#ss").disabled = false; return; }
      closeSheet(); toast("Swap request sent", "ok"); S.reqs = await rpc("skwyd_team_requests"); viewSched(); }catch(e){ $("#se").textContent = "Couldn't send the request."; $("#ss").disabled = false; } };

const mapUrl = o => o.lat != null ? `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}` : o.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address.replace(/^\[[^\]]*\]\s*/, ""))}` : "";
const money = n => "$" + (+n || 0).toFixed(2);
function beep(){ try{ navigator.vibrate?.([300, 120, 300, 120, 300]); const a = new (window.AudioContext || window.webkitAudioContext)(), g = a.createGain(); g.connect(a.destination); [880, 1175, 880, 1175].forEach((f, i) => { const os = a.createOscillator(); os.frequency.value = f; os.connect(g); g.gain.setValueAtTime(.12, a.currentTime); os.start(a.currentTime + i * .22); os.stop(a.currentTime + i * .22 + .18); }); }catch(_){} }
async function drvPoll(){
  if(!DRIVER || !S.me || !navigator.onLine) return; let l; try{ l = await rpc("skwyd_drv_orders"); }catch(_){ return; } S.drv = l;
  const fresh = l.filter(o => o.driverStatus==="assigned"), ids = new Set(fresh.map(o => o.id));
  if(drvKnown){ const n = fresh.filter(o => !drvKnown.has(o.id)); if(n.length){ beep(); newOrderAlert(n[0]); } }
  drvKnown = ids; const d = $("#ddot"); if(d) d.hidden = !fresh.length;
  drvTrack(l.some(o => o.driverStatus==="picked" && o.status!=="closed"));
  if(S.tab==="deliv" && !$("#scrim")) paintDeliv();
}
function drvTrack(on){   // the customer follows the driver while an order is on its way
  if(on && drvWatch==null && navigator.geolocation){ drvWatch = navigator.geolocation.watchPosition(p => { if(Date.now() - drvLast < 20000 || !navigator.onLine) return; drvLast = Date.now(); rpc("skwyd_drv_location", { p_lat:p.coords.latitude, p_lng:p.coords.longitude }).catch(() => {}); }, () => {}, { enableHighAccuracy:true, maximumAge:10000 }); }
  if(!on && drvWatch!=null){ navigator.geolocation.clearWatch(drvWatch); drvWatch = null; }
}
function newOrderAlert(o){ sheet(`<div style="text-align:center"><div style="width:64px;height:64px;border-radius:50%;background:#eef2fc;color:var(--acc);display:grid;place-items:center;margin:0 auto 10px">${ic("bike").replace("<svg", '<svg style="width:32px;height:32px"')}</div><h3 style="margin-bottom:4px">New delivery order</h3>
    <p class="note" style="margin:0 0 14px">${esc(o.branch?.name || "")}${o.no ? " · Order #" + esc(o.no) : ""} · ${money(o.total)}</p><p style="margin:0 0 16px">${esc(addrShort(o.address) || "No address")}</p></div>
    <div class="acts"><button class="btn ghost" data-dact="decline:${esc(o.id)}" style="color:var(--bad)">Decline</button><button class="btn" data-dact="accept:${esc(o.id)}">Accept</button></div>`); }
const addrShort = a => String(a || "").replace(/^\[[^\]]*\]\s*/, "");
function paintDeliv(){
  const m = main(); if(!m || S.tab!=="deliv") return; const l = S.drv || [], open = l.filter(o => o.status!=="closed" && o.driverStatus!=="delivered"), done = l.filter(o => o.driverStatus==="delivered");
  const cash = done.reduce((s, o) => s + (+o.total || 0), 0);
  m.innerHTML = `<div class="row" style="margin:4px 2px 12px"><h2 style="margin:0">My Orders</h2><span class="sp"></span><button class="btn ghost sm" id="drf">Refresh</button></div>
    ${open.length ? open.map(o => `<div class="card dcard" data-dopen="${esc(o.id)}"><div class="row"><b style="font-size:17px">${o.no ? "#" + esc(o.no) : "Order"}</b><span class="pill ${o.driverStatus==="picked" ? "approved" : ""}">${DS[o.driverStatus] || esc(o.driverStatus)}</span><span class="sp"></span><b>${money(o.total)}</b></div>
      <div class="note" style="margin-top:6px">${esc(o.customerName || "Customer")} · ${esc(addrShort(o.address) || "No address")}</div><div class="note">${esc(o.branch?.name || "")}${o.assignedAt ? " · assigned " + hm(o.assignedAt) : ""}</div>
      ${o.driverStatus==="assigned" ? `<div class="acts" style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" data-dact="decline:${esc(o.id)}" style="color:var(--bad)">Decline</button><button class="btn" data-dact="accept:${esc(o.id)}">Accept</button></div>` : ""}</div>`).join("") : `<div class="card"><p class="empty">No orders assigned to you right now.</p></div>`}
    <div class="card"><div class="row"><div><div class="note">Delivered today</div><b style="font-size:22px">${done.length}</b></div><span class="sp"></span><div style="text-align:right"><div class="note">Cash collected</div><b style="font-size:22px">${money(cash)}</b></div></div>
      ${done.slice(0, 10).map(o => `<div class="kv"><span>${o.no ? "#" + esc(o.no) : "Order"} · ${hm(o.deliveredAt)}</span><b>${money(o.total)}</b></div>`).join("")}</div>`;
  $("#drf").onclick = () => drvPoll();
}
async function viewDeliv(){ paintDeliv(); if(!S.drv) main().innerHTML = `<div class="card"><p class="empty">Loading…</p></div>`; await drvPoll(); paintDeliv(); }
function orderSheet(o){
  if(!o) return; const st = o.driverStatus, its = o.items || [], mu = mapUrl(o), ph = telDigits(o.phone);
  sheet(`<div class="row"><h3 style="margin:0">${o.no ? "Order #" + esc(o.no) : "Order"}</h3><span class="sp"></span><span class="pill ${st==="picked" ? "approved" : ""}">${DS[st] || esc(st)}</span></div>
    <div class="kv"><span>Customer</span><b>${esc(o.customerName || "—")}</b></div>
    ${o.phone ? `<div class="kv"><span>Phone</span><a href="tel:${esc(o.phone)}" style="color:var(--acc);font-weight:700">${esc(o.phone)}</a></div>` : ""}
    <div class="kv"><span>Address</span><b style="text-align:right;max-width:65%">${esc(addrShort(o.address) || "—")}</b></div>
    <div class="kv"><span>Pick up at</span><b>${esc(o.branch?.name || "—")}</b></div>
    ${o.notes ? `<div class="kv"><span>Note</span><b style="text-align:right;max-width:65%">${esc(o.notes)}</b></div>` : ""}
    ${its.length ? `<div style="margin:10px 0 4px;font-weight:700">Items</div>${its.map(i => `<div class="kv"><span>${+i.qty || 1}× ${esc(i.name)}</span><b>${money((+i.price || 0) * (+i.qty || 1))}</b></div>`).join("")}` : ""}
    <div class="kv" style="font-size:17px"><span>Collect</span><b>${o.payment && o.status==="closed" ? "Paid" : money(o.total)}</b></div>
    <div class="acts" style="flex-wrap:wrap">${mu ? `<a class="btn ghost" href="${esc(mu)}" target="_blank" rel="noopener" style="text-decoration:none">${ic("map").replace("<svg", '<svg style="width:18px;height:18px"')} Map</a>` : ""}${o.phone ? `<a class="btn ghost" href="tel:${esc(o.phone)}" style="text-decoration:none">${ic("phone").replace("<svg", '<svg style="width:18px;height:18px"')} Call</a>` : ""}</div>
    ${st==="accepted" ? `<input type="file" accept="image/*" capture="environment" id="dph" hidden><div class="err" id="de"></div><button class="btn" id="dpk">${ic("cam").replace("<svg", '<svg style="width:20px;height:20px"')} Order Picked Up</button><p class="note" style="text-align:center;margin-top:8px">Take a picture of the order when you leave the branch.</p>` : ""}
    ${st==="picked" ? `${ph && o.channel!=="online" ? `<a class="btn ghost" style="text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent("Your order is on its way! Track it here: " + trackUrl(o))}">${ic("wa").replace("<svg", '<svg style="width:18px;height:18px"')} Send Tracking Link</a>` : ""}<div class="err" id="de"></div><button class="btn" id="ddl" style="background:var(--ok)">Paid &amp; Delivered</button>` : ""}
    ${st==="delivered" && ph && o.channel!=="online" ? `<a class="btn ghost" style="text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent("Thank you! Please rate your order and driver: " + trackUrl(o))}">${ic("wa").replace("<svg", '<svg style="width:18px;height:18px"')} Send Rating Link</a>` : ""}
    <button class="btn ghost" data-x style="margin-top:10px">Close</button>`);
  const pk = $("#dpk"); if(pk){ pk.onclick = () => $("#dph").click(); $("#dph").onchange = async e => { const f = e.target.files?.[0]; if(!f) return; pk.disabled = true; pk.innerHTML = `<span class="spin"></span> Uploading…`;
    try{ const blob = await shrink(f), path = `${o.id}-${Date.now()}.jpg`; const up = await sb.storage.from("pickups").upload(path, blob, { contentType:"image/jpeg", upsert:false }); if(up.error) throw up.error;
      const r = await rpc("skwyd_drv_action", { p_order:o.id, p_action:"picked", p_photo:path }); if(r?.error) throw new Error(r.error);
      toast("Order picked up · the customer can follow you", "ok"); await drvPoll(); orderSheet((S.drv||[]).find(x => x.id===o.id)); }
    catch(err){ $("#de").textContent = isNet(err) ? "No internet connection. Try again." : (err.message || "Couldn't save the picture."); pk.disabled = false; pk.innerHTML = "Order Picked Up"; } }; }
  const dl = $("#ddl"); if(dl) dl.onclick = async () => { if(!confirm(`Collected ${money(o.total)} and delivered the order?`)) return; dl.disabled = true;
    try{ const r = await rpc("skwyd_drv_action", { p_order:o.id, p_action:"delivered" }); if(r?.error) throw new Error(r.error); toast("Delivered · order closed", "ok"); await drvPoll(); orderSheet((S.drv||[]).find(x => x.id===o.id)); }
    catch(err){ $("#de").textContent = isNet(err) ? "No internet connection. Try again." : (err.message || "Couldn't close the order."); dl.disabled = false; } };
}
// a smaller photo uploads faster on mobile data
function shrink(file){ return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error("Couldn't read the picture.")), "image/jpeg", .78); }; img.onerror = () => rej(new Error("Couldn't read the picture.")); img.src = u; }); }
document.addEventListener("click", async e => {
  const op = e.target.closest("[data-dopen]"); if(op && !e.target.closest("[data-dact]")){ orderSheet((S.drv||[]).find(o => o.id===op.dataset.dopen)); return; }
  const b = e.target.closest("[data-dact]"); if(!b) return; const [act, id] = b.dataset.dact.split(":");
  if(act==="decline" && !confirm("Decline this order? The branch will assign another driver.")) return;
  b.disabled = true; try{ const r = await rpc("skwyd_drv_action", { p_order:id, p_action:act }); if(r?.error){ toast(r.error, "bad"); b.disabled = false; return; }
    closeSheet(); toast(act==="accept" ? "Order accepted" : "Order declined", act==="accept" ? "ok" : ""); await drvPoll(); if(act==="accept"){ go("deliv"); orderSheet((S.drv||[]).find(o => o.id===id)); } }
  catch(err){ toast(isNet(err) ? "No internet connection." : "Something went wrong", "bad"); b.disabled = false; }
});
if(DRIVER) setInterval(drvPoll, 10000);

/* ---------- bottom sheet ---------- */
function sheet(html){ closeSheet(); const w = document.createElement("div"); w.className = "scrim"; w.id = "scrim"; w.innerHTML = `<div class="sheet">${html}</div>`;
  w.addEventListener("click", e => { if(e.target===w || e.target.closest("[data-x]")) closeSheet(); }); document.body.appendChild(w); }
function closeSheet(){ $("#scrim")?.remove(); }
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange", async () => { if(!document.hidden && S.me && S.tab==="clock"){ try{ S.me = await rpc("skwyd_team_me"); viewClock(); }catch(_){} } });
sb.auth.onAuthStateChange((ev) => { if(ev==="SIGNED_OUT" && S.me){ S.me = null; loginView(); } });
boot();
})();
</script>
