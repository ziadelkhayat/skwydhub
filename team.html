<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* sign in */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:28px}
.brand svg.m{width:64px;height:66px}.brand svg.w{width:150px;height:auto}
.brand .sub{font-weight:800;font-size:12px;letter-spacing:.32em;color:var(--acc2);padding-left:.32em}
.f{display:grid;gap:6px;margin-bottom:14px}.f label{font-size:13px;font-weight:600;color:var(--ink2)}.f label b{color:var(--bad)}

.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.55}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0 10px;text-align:center}
/* app */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:12px}
.top .mk{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(23,37,84,.08)}.top .mk svg{width:26px;height:27px}
.top .who{flex:1;min-width:0}.top .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .who small{color:var(--mut);font-size:13px}
.top .out{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
main{flex:1;padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 2px 10px rgba(23,37,84,.05);margin-bottom:14px}
h2{font-size:18px;margin:4px 2px 12px}
.note{color:var(--mut);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

.tabs button svg{width:22px;height:22px}.tabs button.on{color:var(--acc);background:#eef2fc}

.loc{margin-top:12px;font-size:13px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px}.row .sp{flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.kv span{color:var(--ink2)}

.wk{display:flex;align-items:center;gap:8px;margin-bottom:12px}.wk b{flex:1;text-align:center}.wk button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px}
.day{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.day:last-child{border-bottom:0}
.day .d{width:48px;text-align:center;flex:none}.day .d b{display:block;font-size:20px}.day .d small{color:var(--mut);font-size:12px;text-transform:uppercase}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.big{font-size:34px;font-weight:800}.ent{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.ent:last-child{border-bottom:0}.ent .t{flex:1}.ent .t small{color:var(--ink2);display:block}.ent b.h{font-variant-numeric:tabular-nums}

function here(){ return new Promise((res, rej) => { if(!navigator.geolocation) return rej(new Error("Location isn't available on this phone."));
  navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? "Allow location for SKWYD Team to clock in (phone Settings → Apps → SKWYD Team → Permissions)." : e.code === 3 ? "Couldn't get your location in time. Go near a window and try again." : "Couldn't get your location. Turn on Location and try again.")),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }); }); }
async function clockPress(){
  const b = $("#cb"), goIn = !openNow(); b.disabled = true; const lbl = b.innerHTML; b.innerHTML = `<span class="spin"></span><span style="font-size:14px">Checking location…</span>`;

  let c; try{ c = await here(); }catch(e){ return fail(e.message); }   // GPS works without internet
  // check the distance on the phone too, so an offline punch isn't saved from the wrong place
  const near = (S.me.branches||[]).filter(x => x.lat != null && x.lng != null).map(x => ({ ...x, m: distM(c.latitude, c.longitude, +x.lat, +x.lng) })).sort((a, z) => a.m - z.m)[0];
  if(!near) return fail("Your branch has no location yet. Ask your manager to set it in Manage → Branches.");
  if(near.m > 150 + Math.min(c.accuracy || 0, 100)) return fail(`You are ${Math.round(near.m)} m from ${near.name}. Clock in at the branch.`);

  if(!navigator.onLine || Q().length) return save();   // offline, or older punches still waiting: keep the order
  try{ const r = await rpc("skwyd_team_punch", { p_lat:punch.lat, p_lng:punch.lng, p_acc:punch.acc, p_at:punch.at, p_in:punch.in });

// folders, texts, links and files of a knowledge base (old articles: files only, at the top)

    if(k==="text") return `<div style="margin-top:12px">${f.name ? `<h3 style="margin:0 0 6px">${esc(f.name)}</h3>` : ""}<div class="kbt">${kbFmt(f.body)}</div></div>`;

  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error("Couldn't read the picture.")), "image/jpeg", .78); }; img.onerror = () => rej(new Error("Couldn't read the picture.")); img.src = u; }); }
