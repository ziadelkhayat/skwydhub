  $("#view").innerHTML = `<h1>Price List</h1><p class="subt">What each part of Skwyd Hub costs (${esc(cur)}). New invoices use these prices; a company's discount applies on top.</p>
  <form id="pl" class="card"><table><thead><tr><th>Name</th><th>Charged</th><th class="num">Monthly</th><th class="num">Yearly</th><th>Always Included</th><th>Offered</th></tr></thead><tbody>
  ${ps.map(p => `<tr data-id="${esc(p.id)}"><td><input class="sel" name="name" value="${esc(p.name)}" required></td>
    <td><select class="sel" name="unit">${Object.entries(unit).map(([k,t]) => `<option value="${k}" ${p.unit===k?"selected":""}>${t}</option>`).join("")}</select></td>
    <td class="num"><input class="sel" name="monthly" type="number" min="0" step="0.01" value="${p.monthly}" style="width:110px;text-align:right"></td>
    <td class="num"><input class="sel" name="yearly" type="number" min="0" step="0.01" value="${p.yearly}" style="width:110px;text-align:right"></td>
    <td><input type="checkbox" name="required" ${p.required?"checked":""}></td><td><input type="checkbox" name="active" ${p.active?"checked":""}></td></tr>`).join("")}
  </tbody></table><div class="bar" style="border-top:1px solid var(--line);border-bottom:0"><div class="err" id="perr"></div><div class="sp"></div><button class="btn pri">Save</button></div></form>`;
  $("#pl").onsubmit = async e => {
    e.preventDefault();
    const list = [...document.querySelectorAll("#pl tr[data-id]")].map((tr, i) => ({ id: tr.dataset.id, name: $("[name=name]", tr).value.trim(), unit: $("[name=unit]", tr).value,
      monthly: Number($("[name=monthly]", tr).value) || 0, yearly: Number($("[name=yearly]", tr).value) || 0, required: $("[name=required]", tr).checked, active: $("[name=active]", tr).checked, sort: i + 1 }));
    try { DATA.products = await rpc("slick_pa_save_products", { p: list }); await load(); } catch (err) { $("#perr").textContent = err.message; }
  };
}

// ---------- settings ----------
function viewSettings() {
  const s = DATA.settings || {};
  $("#view").innerHTML = `<h1>Settings</h1><p class="subt">How trials and late payments work for every company.</p>
  <form id="stf" class="card" style="padding:18px;max-width:640px"><div class="grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="fld"><label>Free Trial (Days)</label><input class="sel" name="trialDays" type="number" min="0" step="1" value="${s.trialDays ?? 14}"></div>
    <div class="fld"><label>Grace Period (Days)</label><input class="sel" name="graceDays" type="number" min="0" step="1" value="${s.graceDays ?? 7}"></div>
    <div class="fld"><label>Currency</label><select class="sel" name="currency">${["USD","EUR","LBP"].map(c => `<option ${s.currency===c?"selected":""}>${c}</option>`).join("")}</select></div>
  </div><div class="grid" style="grid-template-columns:repeat(2,1fr)">
    <div class="fld"><label>Support Phone</label><input class="sel" name="supportPhone" value="${esc(s.supportPhone || "")}"></div>
    <div class="fld"><label>Support Email</label><input class="sel" name="supportEmail" type="email" value="${esc(s.supportEmail || "")}"></div>
  </div><p class="note">Restaurants see the support phone and email on their Subscription page and lock screen, to pay or change their plan.</p><p class="note">After the trial or the paid period ends, the company has the grace period to pay. Then its back office, POS and online ordering lock until an invoice is paid. Its data is kept.</p>
  <div style="display:flex;align-items:center;gap:10px"><div class="err" id="sterr"></div><span style="flex:1"></span><button class="btn pri">Save</button></div></form>`;
  $("#stf").onsubmit = async e => {
    e.preventDefault(); const f = e.target.elements;
    try { DATA.settings = await rpc("slick_pa_save_settings", { p: { trialDays: Number(f.trialDays.value) || 0, graceDays: Number(f.graceDays.value) || 0, currency: f.currency.value, supportPhone: f.supportPhone.value.trim(), supportEmail: f.supportEmail.value.trim() } }); await load(); }
    catch (err) { $("#sterr").textContent = err.message; }
  };
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#m")?.classList.contains("on")) close_();
});
boot();
</script>
</body>
</html>
