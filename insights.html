<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1330">
<title>SKWYD Insights</title>
<style>
:root{--nav:#0B1330;--nav2:#141E44;--acc:#1E3A8A;--lime:#6D28D9;--ink:#0C1738;--ink2:#4B5563;--mut:#8A90A6;--line:#E6E8F2;--bg:#F3F4F8;--ok:#16a34a;--bad:#b42318;--warn:#d97706}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.hd{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:max(14px,env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px}
.hd b{font-size:18px;flex:1}.hd small{display:block;color:#8C96B8;font-size:12px;font-weight:500}
.hd select{background:var(--nav2);color:#fff;border:1px solid #22305F;border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;max-width:44vw}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px max(6px,env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;position:relative}
.tabs button.on{color:var(--acc)}.tabs svg{width:22px;height:22px}
.dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
h2{font-size:22px;margin:4px 4px 12px}h3{font-size:15px;margin:18px 4px 8px;color:var(--ink2)}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(11,19,48,.05);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.kpi{background:#fff;border-radius:16px;padding:14px}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}.kpi b{display:block;font-size:22px;margin-top:4px}.kpi em{font-style:normal;font-size:12px;font-weight:600}
.kpi.hero{grid-column:1/-1;background:var(--nav);color:#fff}.kpi.hero small{color:#8C96B8}.kpi.hero b{font-size:30px;color:#C4B5FD}
.seg{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}.seg button.on{background:var(--nav);border-color:var(--nav);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{display:block;color:var(--mut);font-size:12.5px}
.row em{font-style:normal;font-weight:700;font-size:14px;white-space:nowrap}
.av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#EEF2FF;color:var(--acc);font-weight:700;font-size:13px}
.bar{height:8px;border-radius:9px;background:#EEF0F6;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:#EEF0F6;color:var(--ink2)}.pill.ok{background:#e7f7ec;color:var(--ok)}.pill.bad{background:#fdecec;color:var(--bad)}.pill.warn{background:#fff4e0;color:var(--warn)}.pill.blue{background:#e8eefe;color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:22px 10px;margin:0}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.chart i{width:100%;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}.chart span{font-size:10.5px;color:var(--mut)}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:70px}.msg{max-width:80%;align-self:flex-start}.msg span{display:block;background:#fff;border-radius:14px 14px 14px 4px;padding:9px 12px;white-space:pre-wrap;word-break:break-word}.msg span b{display:block;font-size:12px;color:#6d28d9}.msg small{font-size:11px;color:var(--mut);margin:2px 6px}
.msg.me{align-self:flex-end;text-align:right}.msg.me span{background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px;text-align:left}
.compose{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 12px;background:var(--bg)}.compose input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;background:#fff}
.btn{border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;padding:11px 16px}.btn.ghost{background:#fff;color:var(--acc);border:1px solid var(--line)}
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:6px 4px;margin-bottom:6px}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:#fff;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.kbt h3,.kbt h4{color:var(--ink);margin:12px 0 4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="supabase.js"></script>
<script>if(!window.supabase) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');</script>
<script src="wokdb.js"></script>
<script>
/* SKWYD Insights: the owner's app — sales, orders, the team, chats, tasks and guides, live */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const S = { tab:"home", range:"today", branch:"", chat:null, kb:null, seen:{} };
const D = {};   // live data by collection
let db = null, me = { name:"Owner", role:"" };
const IC = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', orders:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
  team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>', task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  kb:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/>' };
const ic = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||""}</svg>`;
const toast = (m, k) => { const t = $("#toast"); t.textContent = m; t.className = "toast show " + (k||""); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 2400); };
const co = () => (D.settings||[]).find(x => x.id==="company") || {};
const DEC = () => { const d = co().priceDecimals; return d===0 || d==="0" ? 0 : +d || 2; };
const money = n => (String(co().currencySymbol || "").trim() || co().currency || "$") + (+n||0).toLocaleString("en-US", { minimumFractionDigits:DEC(), maximumFractionDigits:DEC() });
const p2 = n => String(n).padStart(2, "0");
const dmy = v => { if(!v) return "—"; const d = /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? new Date(v + "T12:00:00") : new Date(v); return isNaN(d) ? "—" : p2(d.getDate()) + "-" + p2(d.getMonth()+1) + "-" + d.getFullYear(); };
const hm = v => { const d = new Date(v); return isNaN(d) ? "" : d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" }); };
const day = d => d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate());
const today = () => day(new Date());
const init = n => String(n||"?").trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
const live = x => x && !x.deleted;
const brs = () => (D.branches||[]).filter(b => b.active!==false && !b.deleted);
const brName = id => (D.branches||[]).find(b => b.id===id)?.name || "—";
const inBr = id => !S.branch || id===S.branch;
const users = () => (D.users||[]).filter(u => live(u) && u.active!==false && u.role!=="owner");
const uName = id => (D.users||[]).find(u => u.id===id)?.name || "—";

function rangeFrom(){ const d = new Date(); d.setHours(0,0,0,0); if(S.range==="week") d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); if(S.range==="month") d.setDate(1); return d; }
const sales = () => (D.orders||[]).filter(o => o.status==="closed" && inBr(o.branchId) && new Date(o.closedAt || o.createdAt) >= rangeFrom());

function shell(){
  $("#app").innerHTML = `<header class="hd"><div style="flex:1"><b id="hdT">Insights</b><small>${esc(co().name || "")}</small></div><select id="brSel"><option value="">All Branches</option>${brs().map(b => `<option value="${esc(b.id)}" ${S.branch===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select></header>
    <main id="main"></main>
    <nav class="tabs">${[["home","Sales","home"],["orders","Orders","orders"],["team","Team","team"],["chat","Chats","chat"],["tasks","Tasks","task"],["kb","Guides","kb"]].map(([k,t,i]) => `<button data-tab="${k}" class="${S.tab===k?"on":""}">${ic(i)}${t}</button>`).join("")}</nav>`;
  $("#brSel").onchange = e => { S.branch = e.target.value; paint(); };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.chat = null; S.kb = null; document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x===b)); window.scrollTo(0,0); paint(); });
}
function paint(){ const m = $("#main"); if(!m) return; const keepY = scrollY; m.innerHTML = ({ home:vHome, orders:vOrders, team:vTeam, chat:vChat, tasks:vTasks, kb:vKb })[S.tab](); wire(); if(S.tab==="chat" && S.chat){ window.scrollTo(0, document.body.scrollHeight); } else window.scrollTo(0, keepY); }

/* ---------- Sales: totals, by branch, by hour, top items ---------- */
function vHome(){
  const l = sales(), tot = l.reduce((s,o) => s + (+o.total||0), 0), n = l.length, avg = n ? tot/n : 0;
  const open = (D.orders||[]).filter(o => ["pending","active","review"].includes(o.status) && inBr(o.branchId)).length;
  const voids = (D.orders||[]).filter(o => o.status==="void" && inBr(o.branchId) && new Date(o.voidedAt || o.createdAt) >= rangeFrom());
  const byBr = brs().map(b => [b.name, l.filter(o => o.branchId===b.id).reduce((s,o) => s + (+o.total||0), 0)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]), mx = Math.max(1, ...byBr.map(x => x[1]));
  const items = {}; l.forEach(o => (o.items||[]).forEach(i => { const k = i.name || "Item"; (items[k] ||= { q:0, v:0 }); items[k].q += +i.qty||1; items[k].v += (+i.price||0) * (+i.qty||1); }));
  const top = Object.entries(items).sort((a,b) => b[1].v - a[1].v).slice(0, 8);
  let chart = "";
  if(S.range==="today"){ const h = Array(24).fill(0); l.forEach(o => h[new Date(o.closedAt || o.createdAt).getHours()] += +o.total||0); const from = Math.max(0, h.findIndex(v => v) - 1), to = 23 - Math.max(0, [...h].reverse().findIndex(v => v) - 1); const sl = from <= to ? h.slice(from, to + 1) : []; const mh = Math.max(1, ...sl);
    chart = sl.length ? `<div class="card"><b>By hour</b><div class="chart">${sl.map((v, i) => `<div><i style="height:${v/mh*100}%"></i><span>${from + i}</span></div>`).join("")}</div></div>` : ""; }
  else { const days = {}; l.forEach(o => { const k = day(new Date(o.closedAt || o.createdAt)); days[k] = (days[k]||0) + (+o.total||0); }); const ks = Object.keys(days).sort(), md = Math.max(1, ...Object.values(days));
    chart = ks.length ? `<div class="card"><b>By day</b><div class="chart">${ks.map(k => `<div><i style="height:${days[k]/md*100}%"></i><span>${k.slice(8)}</span></div>`).join("")}</div></div>` : ""; }
  return `<div class="seg">${[["today","Today"],["week","This Week"],["month","This Month"]].map(([k,t]) => `<button data-range="${k}" class="${S.range===k?"on":""}">${t}</button>`).join("")}</div>
    <div class="kpis"><div class="kpi hero"><small>Sales</small><b>${money(tot)}</b></div><div class="kpi"><small>Orders</small><b>${n}</b></div><div class="kpi"><small>Average</small><b>${money(avg)}</b></div>
      <div class="kpi"><small>Open Now</small><b>${open}</b></div><div class="kpi"><small>Voids</small><b style="${voids.length ? "color:var(--bad)" : ""}">${voids.length}</b><em style="color:var(--mut)">${money(voids.reduce((s,o) => s + (+o.total||0), 0))}</em></div></div>
    ${chart}
    ${!S.branch && byBr.length ? `<div class="card"><b>By branch</b>${byBr.map(([nm, v]) => `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>${esc(nm)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}</div>` : ""}
    <div class="card"><b>Top items</b>${top.map(([nm, x]) => `<div class="row"><span class="t"><b>${esc(nm)}</b><small>${x.q} sold</small></span><em>${money(x.v)}</em></div>`).join("") || '<p class="empty">No sales yet.</p>'}</div>`;
}

/* ---------- Orders: live and recent ---------- */
const ST = { review:["Waiting · call center","warn"], pending:["Waiting · branch","warn"], active:["Preparing","blue"], closed:["Done","ok"], void:["Void","bad"], declined:["Declined","bad"], returned:["Returned","bad"], refund:["Refund","bad"], draft:["Draft",""] };
const TYP = { dinein:"Dine In", pickup:"Pickup", takeaway:"Pickup", delivery:"Delivery", fast:"Fast Order" };
function vOrders(){
  const l = (D.orders||[]).filter(o => inBr(o.branchId) && o.status!=="draft" && day(new Date(o.createdAt))===today()).sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const f = S.of || "live", show = l.filter(o => f==="all" || (f==="live" ? ["review","pending","active"].includes(o.status) : o.status===f));
  return `<h2>Today's Orders</h2><div class="seg">${[["live","Live"],["closed","Done"],["void","Void"],["all","All"]].map(([k,t]) => `<button data-of="${k}" class="${f===k?"on":""}">${t} (${l.filter(o => k==="all" || (k==="live" ? ["review","pending","active"].includes(o.status) : o.status===k)).length})</button>`).join("")}</div>
    <div class="card">${show.map(o => `<div class="row"><span class="av">${esc((TYP[o.type]||"O")[0])}</span><span class="t"><b>${esc(o.no ? "#" + o.no : o.ref || "Order")} · ${esc(TYP[o.type] || o.type || "")}</b><small>${esc([brName(o.branchId), o.customerName, hm(o.createdAt)].filter(Boolean).join(" · "))}</small><small><span class="pill ${ST[o.status]?.[1]||""}">${esc(ST[o.status]?.[0] || o.status)}</span>${o.voidReason ? " " + esc(o.voidReason) : ""}</small></span><em>${money(o.total)}</em></div>`).join("") || '<p class="empty">No orders here.</p>'}</div>`;
}

/* ---------- Team: clocked in, today's schedule, requests ---------- */
function vTeam(){
  const tc = (D.settings||[]).find(x => x.id==="timeclock") || {}, open = Object.entries(tc.open || {}).map(([userId, o]) => ({ userId, ...o })).filter(o => inBr(o.branchId));
  const sh = (D.work_shifts||[]).filter(x => live(x) && x.published!==false && String(x.day).slice(0,10)===today() && inBr(x.branchId)).sort((a,b) => String(a.startTime).localeCompare(String(b.startTime)));
  const onIds = new Set(open.map(o => o.userId)), late = sh.filter(x => x.employeeId && !onIds.has(x.employeeId) && String(x.startTime).slice(0,5) < new Date().toTimeString().slice(0,5));
  const rq = (D.work_requests||[]).filter(r => live(r) && r.status==="pending");
  const LT = { annual:"Annual Leave", sick:"Sick Leave", unpaid:"Unpaid Leave" };
  return `<div class="kpis"><div class="kpi"><small>Clocked In</small><b style="color:var(--ok)">${open.length}</b></div><div class="kpi"><small>On Schedule</small><b>${sh.length}</b></div><div class="kpi"><small>Not In Yet</small><b style="${late.length ? "color:var(--bad)" : ""}">${late.length}</b></div><div class="kpi"><small>Requests</small><b style="${rq.length ? "color:var(--warn)" : ""}">${rq.length}</b></div></div>
    <h3>Clocked in now</h3><div class="card">${open.map(o => `<div class="row"><span class="av">${esc(init(uName(o.userId) !== "—" ? uName(o.userId) : o.name))}</span><span class="t"><b>${esc(uName(o.userId) !== "—" ? uName(o.userId) : o.name || "—")}</b><small>${esc(brName(o.branchId))} · since ${esc(hm(o.at))}</small></span><em style="color:var(--ok)">${((Date.now() - new Date(o.at)) / 3600000).toFixed(1)}h</em></div>`).join("") || '<p class="empty">Nobody is clocked in.</p>'}</div>
    <h3>Today's schedule</h3><div class="card">${sh.map(x => `<div class="row"><span class="av">${esc(init(x.employeeId ? uName(x.employeeId) : "Open"))}</span><span class="t"><b>${esc(x.employeeId ? uName(x.employeeId) : "Open shift")}</b><small>${esc(brName(x.branchId))} · ${esc(String(x.startTime).slice(0,5))} – ${esc(String(x.endTime).slice(0,5))}</small></span>${x.employeeId ? (onIds.has(x.employeeId) ? '<span class="pill ok">In</span>' : late.includes(x) ? '<span class="pill bad">Not in</span>' : '<span class="pill">Later</span>') : ""}</div>`).join("") || '<p class="empty">No shifts today.</p>'}</div>
    <h3>Waiting requests</h3><div class="card">${rq.map(r => `<div class="row"><span class="av">${esc(init(uName(r.employeeId)))}</span><span class="t"><b>${esc(uName(r.employeeId))}</b><small>${r.kind==="swap" ? "Shift swap" : esc(LT[r.leaveType] || "Time off") + " · " + dmy(String(r.fromDay).slice(0,10)) + (r.toDay && r.toDay!==r.fromDay ? " – " + dmy(String(r.toDay).slice(0,10)) : "")}</small>${r.note ? `<small>${esc(r.note)}</small>` : ""}</span></div>`).join("") || '<p class="empty">No waiting requests.</p>'}${rq.length ? '<p style="color:var(--mut);font-size:12.5px;margin:8px 4px 0">Approve or decline in the back office: Employee Management → Requests.</p>' : ""}</div>`;
}

/* ---------- Chats: every group, channel and private chat; the owner can write in groups and channels ---------- */
const cMsgs = id => (D.chat_messages||[]).filter(m => m.groupId===id && !m.deleted).sort((a,b) => String(a.createdAt).localeCompare(String(b.createdAt)));
const cName = g => g.kind==="direct" ? (g.memberIds||[]).map(uName).join(" & ") : g.name;
function vChat(){
  const gs = (D.chat_groups||[]).filter(live).map(g => ({ g, l: cMsgs(g.id).slice(-1)[0] })).sort((a,b) => String(b.l?.createdAt || b.g.createdAt).localeCompare(String(a.l?.createdAt || a.g.createdAt)));
  if(S.chat){ const g = (D.chat_groups||[]).find(x => x.id===S.chat); if(!g){ S.chat = null; return vChat(); } const direct = g.kind==="direct";
    return `<button class="back" data-cback>‹ Chats</button><h2 style="margin-top:0">${esc(cName(g))}</h2>${direct ? '<p style="color:var(--mut);margin:-6px 4px 10px;font-size:13px">Private chat · read only</p>' : ""}
      <div class="msgs">${cMsgs(g.id).map(m => `<div class="msg ${m.fromOffice ? "me" : ""}"><span>${m.fromOffice ? "" : `<b>${esc(m.senderName || "—")}</b>`}${esc(m.body)}</span><small>${m.fromOffice && m.senderName ? esc(m.senderName) + " · " : ""}${esc(dmy(m.createdAt) === dmy(new Date()) ? hm(m.createdAt) : dmy(m.createdAt) + " " + hm(m.createdAt))}</small></div>`).join("") || '<p class="empty">No messages yet.</p>'}</div>
      ${direct ? "" : `<form class="compose" id="cf"><input id="ci" placeholder="Write a message…" autocomplete="off" maxlength="2000"><button class="btn">Send</button></form>`}`; }
  return `<h2>Chats</h2><div class="card">${gs.map(({ g, l }) => `<button class="row" data-chat="${esc(g.id)}"><span class="av">${esc(init(cName(g)))}</span><span class="t"><b>${esc(cName(g))} ${g.kind==="channel" ? '<span class="pill">Channel</span>' : g.kind==="direct" ? '<span class="pill">Private</span>' : ""}</b><small>${l ? esc((l.fromOffice ? "You: " : (l.senderName || "") + ": ") + l.body) : "No messages yet"}</small></span><small style="color:var(--mut)">${l ? esc(dmy(l.createdAt)===dmy(new Date()) ? hm(l.createdAt) : dmy(l.createdAt).slice(0,5)) : ""}</small></button>`).join("") || '<p class="empty">No chats yet.</p>'}</div>`;
}

/* ---------- Tasks ---------- */
function vTasks(){
  const l = (D.tasks||[]).filter(live).filter(t => !S.branch || t.branchId===S.branch || !t.branchId), f = S.tf || "open";
  const show = l.filter(t => f==="all" || (f==="done") === (t.status==="done")).sort((a,b) => String(a.dueDay||"9999").localeCompare(String(b.dueDay||"9999")));
  const who = t => (t.assigneeIds||[]).length ? t.assigneeIds.map(uName).join(", ") : (t.branchId ? "Everyone at " + brName(t.branchId) : "Everyone");
  if(S.tnew) return `<button class="back" data-tback>‹ Tasks</button><h2 style="margin-top:0">New Task</h2><div class="card"><input class="in" id="tt" placeholder="Task, e.g. Clean the fryer" maxlength="200"><textarea class="in" id="tn" rows="3" placeholder="Notes"></textarea>
      <select class="in" id="tb"><option value="">All Branches</option>${brs().map(b => `<option value="${esc(b.id)}" ${S.branch===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select><input class="in" id="td" type="date">
      <select class="in" id="te"><option value="">Everyone at the branch</option>${users().sort((a,b) => String(a.name).localeCompare(String(b.name))).map(u => `<option value="${esc(u.id)}">${esc(u.name)}</option>`).join("")}</select><button class="btn" id="ts" style="width:100%">Add Task</button></div>`;
  return `<div style="display:flex;align-items:center"><h2 style="flex:1">Tasks</h2><button class="btn" data-tnew>+ New</button></div><div class="seg">${[["open","Open"],["done","Done"],["all","All"]].map(([k,t]) => `<button data-tf="${k}" class="${f===k?"on":""}">${t} (${l.filter(x => k==="all" || (k==="done") === (x.status==="done")).length})</button>`).join("")}</div>
    <div class="card">${show.map(t => { const late = t.status!=="done" && t.dueDay && String(t.dueDay).slice(0,10) < today();
      return `<div class="row"><span class="av" style="${t.status==="done" ? "background:#e7f7ec;color:var(--ok)" : ""}">${ic("task").replace("<svg", '<svg style="width:18px;height:18px"')}</span><span class="t"><b>${esc(t.title)}</b><small>${esc(who(t))}</small><small>${t.status==="done" ? "Done by " + esc(t.doneBy || "—") + " · " + dmy(t.doneAt) : t.dueDay ? (late ? '<span style="color:var(--bad);font-weight:700">Late · due ' + dmy(String(t.dueDay).slice(0,10)) + "</span>" : "Due " + dmy(String(t.dueDay).slice(0,10))) : "No due date"}</small></span></div>`; }).join("") || '<p class="empty">No tasks here.</p>'}</div>`;
}

/* ---------- Guides (knowledge base) with who read them ---------- */
const kbBody = t => esc(t||"").replace(/^### (.*)$/gm, "<h4>$1</h4>").replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^- (.*)$/gm, "• $1").replace(/\n/g, "<br>");
function kbAud(a){ const rs = a.roleIds||[], bs = a.branchIds||[], es = a.employeeIds||[], byGroup = !es.length || rs.length || bs.length; const rids = u => [...new Set([u.roleId, ...(u.roleIds||[])].filter(Boolean))];
  return users().filter(u => es.includes(u.id) || (byGroup && (!rs.length || rids(u).some(r => rs.includes(r))) && (!bs.length || !(u.branchIds||[]).length || (u.branchIds||[]).some(b => bs.includes(b))))); }
function vKb(){
  const l = (D.kb_articles||[]).filter(a => live(a) && !a.archived), reads = id => (D.kb_reads||[]).filter(r => r.articleId===id);
  if(S.kb){ const a = l.find(x => x.id===S.kb); if(!a){ S.kb = null; return vKb(); } const aud = kbAud(a), rd = Object.fromEntries(reads(a.id).map(r => [r.staffId, r]));
    const items = (a.files||[]).filter(f => (f.kind||"file")!=="folder");
    return `<button class="back" data-kbback>‹ Guides</button><h2 style="margin-top:0">${esc(a.title)}</h2>
      <div class="kpis"><div class="kpi"><small>${a.ack ? "Confirmed" : "Opened"}</small><b>${aud.filter(u => rd[u.id]).length} / ${aud.length}</b></div><div class="kpi"><small>Views</small><b>${reads(a.id).reduce((s,r) => s + (+r.views||1), 0)}</b></div></div>
      <div class="card kbt">${a.body ? kbBody(a.body) : ""}${items.map(f => f.kind==="text" ? `${f.name ? `<h3>${esc(f.name)}</h3>` : ""}${kbBody(f.body)}` : f.kind==="link" ? `<p><a href="${esc(/^https?:/i.test(f.url||"") ? f.url : "https://" + (f.url||""))}" target="_blank" rel="noopener">${esc(f.name || f.url)}</a></p>` : `<p>📎 ${esc(f.name)}</p>`).join("") || (a.body ? "" : '<p class="empty">Open it in the back office to see the files.</p>')}</div>
      <h3>Who read it</h3><div class="card">${aud.map(u => `<div class="row"><span class="av">${esc(init(u.name))}</span><span class="t"><b>${esc(u.name)}</b><small>${rd[u.id] ? "Last " + dmy(rd[u.id].lastViewedAt || rd[u.id].readAt) + " · " + (+rd[u.id].views||1) + " views" : "Not yet"}</small></span>${rd[u.id] ? '<span class="pill ok">Read</span>' : '<span class="pill">Not yet</span>'}</div>`).join("") || '<p class="empty">Nobody is assigned.</p>'}</div>`; }
  return `<h2>Guides</h2><div class="card">${l.map(a => { const aud = kbAud(a), n = reads(a.id).filter(r => aud.some(u => u.id===r.staffId)).length;
    return `<button class="row" data-kb="${esc(a.id)}"><span class="av">${ic("kb").replace("<svg", '<svg style="width:18px;height:18px"')}</span><span class="t"><b>${esc(a.title)}</b><small>${esc(a.category || "")}${a.status==="draft" ? " · Draft" : ""}</small></span><em style="color:${aud.length && n >= aud.length ? "var(--ok)" : "var(--ink2)"}">${n}/${aud.length}</em></button>`; }).join("") || '<p class="empty">No guides yet.</p>'}</div>`;
}

function wire(){
  document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { S.range = b.dataset.range; paint(); });
  document.querySelectorAll("[data-of]").forEach(b => b.onclick = () => { S.of = b.dataset.of; paint(); });
  document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { S.tf = b.dataset.tf; paint(); });
  document.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => { S.chat = b.dataset.chat; paint(); });
  document.querySelectorAll("[data-kb]").forEach(b => b.onclick = () => { S.kb = b.dataset.kb; window.scrollTo(0,0); paint(); });
  $("[data-cback]") && ($("[data-cback]").onclick = () => { S.chat = null; paint(); });
  $("[data-kbback]") && ($("[data-kbback]").onclick = () => { S.kb = null; paint(); });
  $("[data-tnew]") && ($("[data-tnew]").onclick = () => { S.tnew = true; paint(); });
  $("[data-tback]") && ($("[data-tback]").onclick = () => { S.tnew = false; paint(); });
  const cf = $("#cf"); if(cf) cf.onsubmit = async e => { e.preventDefault(); const i = $("#ci"), body = i.value.trim(); if(!body) return; i.value = "";
    try{ await db.collection("chat_messages").doc("cm_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7)).set({ groupId: S.chat, body, fromOffice:true, senderName: me.name, deleted:false }); }catch(er){ console.error(er); i.value = body; toast("Couldn't send the message.", "bad"); } };
  const ts = $("#ts"); if(ts) ts.onclick = async () => { const title = $("#tt").value.trim(); if(!title) return toast("Enter the task.", "bad"); ts.disabled = true;
    try{ await db.collection("tasks").doc("tk_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7)).set({ title, notes: $("#tn").value.trim() || null, branchId: $("#tb").value || null, dueDay: $("#td").value || null, assigneeIds: $("#te").value ? [$("#te").value] : [], status:"open", createdBy: me.name, deleted:false });
      S.tnew = false; toast("Task added", "ok"); paint(); }catch(er){ console.error(er); ts.disabled = false; toast("Couldn't add the task.", "bad"); } };
}

(async function start(){
  let tries = 0; while(!window.claude?.use && tries++ < 100) await new Promise(r => setTimeout(r, 100));
  db = await window.claude.use("db"); const u = await window.claude.use("user");
  me = { name: (await u.name()) || "Owner", role: (await u.role()) || "" };
  if(!["owner","admin"].includes(me.role)){ $("#app").innerHTML = `<div style="padding:60px 24px;text-align:center"><h2>Owner only</h2><p style="color:var(--mut)">SKWYD Insights is for the owner and admins. Employees use the Employee App.</p><button class="btn" id="so">Sign out</button></div>`;
    $("#so").onclick = async () => { await window.WOK?.sb.auth.signOut(); location.reload(); }; return; }
  shell(); paint();
  let t = 0; const later = () => { clearTimeout(t); t = setTimeout(() => { if(!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) paint(); }, 150); };
  ["settings","branches","orders","users","work_shifts","work_requests","chat_groups","chat_messages","kb_articles","kb_reads","tasks"].forEach(c => db.collection(c).onSnapshot(snap => {
    D[c] = (snap.docs || snap).map(d => { const v = typeof d.data === "function" ? d.data() : d; return { ...v, id: d.id ?? v.id }; });
    if(c==="settings" || c==="branches") shell(); later(); }, err => console.error(c, err)));
})();
</script>
